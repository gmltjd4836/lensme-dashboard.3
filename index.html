<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌즈미 상권 분석 대시보드 (V4.8 - 랭킹 스팟 & 하이브리드 엔진)</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 800; }
        .tab-btn { color: #64748b; font-weight: 600; border-bottom: 4px solid transparent; }
        
        input[type=checkbox] { width: 1.1rem; height: 1.1rem; cursor: pointer; }
        .chk-purple { accent-color: #9333ea; } .chk-orange { accent-color: #f97316; } 
        .chk-red { accent-color: #dc2626; } .chk-green { accent-color: #16a34a; } 
        .chk-yellow { accent-color: #eab308; } .chk-pink { accent-color: #f472b6; } 
        .chk-blue { accent-color: #3b82f6; } .chk-emerald { accent-color: #059669; }

        /* 매장 마커 툴팁 */
        .store-tooltip { background: #ffffff; border: 2px solid #334155; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: #0f172a; box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap; transform: translateY(-10px); z-index: 200;}
        .store-tooltip::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: #334155 transparent transparent transparent; }

        /* 상권 다각형 위에 예쁘게 뜨는 이름표 */
        .poly-nametag { background: rgba(255, 255, 255, 0.95); border: 2px solid #be185d; border-radius: 8px; padding: 4px 10px; color: #be185d; font-size: 13px; font-weight: 900; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; white-space: nowrap; z-index: 80; pointer-events: none; margin-top:-15px; margin-left: -50%; }
        
        /* 💡 V4.8 랭킹 마커 스타일 */
        .rank-badge { position: absolute; top: -35px; left: -30px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 4px 10px; font-size: 14px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3); white-space: nowrap; pointer-events: none; z-index: 300; }
        .rank-1 { border: 2px solid #eab308; color: #b45309; }
        .rank-2 { border: 2px solid #94a3b8; color: #334155; }
        .rank-3 { border: 2px solid #b45309; color: #78350f; }
        .rank-dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); margin-left: -9px; margin-top: -9px; position: absolute; z-index: 290; }
        .rank-dot-1 { background: #eab308; animation: pulse-core 1.5s infinite;}
        .rank-dot-2 { background: #94a3b8; }
        .rank-dot-3 { background: #b45309; }
        @keyframes pulse-core { 0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(234, 179, 8, 0); } 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); } }

        /* 트리형 폴더 스타일 */
        details > summary { list-style: none; cursor: pointer; font-weight: 800; color: #334155; padding: 4px 0; font-size: 14px;}
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before { content: '📁 '; }
        details[open] > summary::before { content: '📂 '; }
        .tree-indent { margin-left: 16px; border-left: 2px dashed #cbd5e1; padding-left: 8px; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen text-slate-800">

    <div class="w-full md:w-1/4 bg-white border-r border-gray-200 p-6 flex flex-col shadow-lg z-20 overflow-y-auto">
        <h1 class="text-xl font-extrabold text-slate-800 border-b-4 border-indigo-500 pb-3 mb-4 flex justify-between items-center">
            <span>🗺️ 전국구 상권 관제탑</span>
            <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-bold">V4.8 Final</span>
        </h1>
        
        <div class="mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <label class="block text-sm font-extrabold text-indigo-700 mb-2">🎯 상권 검색 이동</label>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="예: 의정부역, 부평역" class="w-full bg-white border border-indigo-300 px-3 py-2 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeypress="if(event.key==='Enter') searchLocation()">
                <button onclick="searchLocation()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-bold transition shadow-sm whitespace-nowrap">검색</button>
            </div>
        </div>

        <div class="mb-4 bg-rose-50 p-4 rounded-xl border border-rose-200 flex-grow flex flex-col min-h-[300px]">
            <label class="block text-sm font-extrabold text-rose-700 mb-2">💾 내 상권 보관함 (전국)</label>
            <div class="flex gap-2 mb-3" id="drawControls">
                <button onclick="startDrawing()" id="btnStartDraw" class="w-full bg-rose-500 hover:bg-rose-600 text-white px-3 py-2 rounded-lg text-sm font-bold transition shadow-sm">➕ 상권 영토 그리기</button>
                <button onclick="saveDrawing()" id="btnSaveDraw" class="hidden flex-1 bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-bold transition shadow-sm">저장</button>
                <button onclick="cancelDrawing()" id="btnCancelDraw" class="hidden flex-1 bg-slate-500 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-sm font-bold transition shadow-sm">취소</button>
            </div>
            <div id="savedPolygonTree" class="flex-grow overflow-y-auto space-y-1 bg-white p-2 rounded border border-rose-100 shadow-inner text-sm">
                <!-- 폴더 트리 렌더링 -->
            </div>
        </div>

        <div class="mb-2 bg-white p-4 rounded-lg border border-slate-200 shadow-sm space-y-3">
            <div>
                <p class="text-xs text-slate-400 font-bold mb-1">현재 분석 타겟</p>
                <div class="flex justify-between items-center bg-slate-50 border border-indigo-300 rounded-md px-3 py-1.5">
                    <span id="targetLocationInput" class="font-extrabold text-indigo-600 text-sm truncate">선택 없음 (자유 탐색)</span>
                    <button onclick="clearActivePolygon()" id="btnClearPolygon" class="hidden text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded font-bold hover:bg-slate-300 whitespace-nowrap ml-2">영토 해제</button>
                </div>
            </div>
            
            <div class="bg-indigo-50/80 p-3 rounded-lg border border-indigo-100 space-y-1.5 mt-2">
                <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                    <span>⚔️ 펜스 내부 경쟁샵:</span>
                    <span id="comp_count" class="text-sm font-black text-pink-600">-개</span>
                </div>
                <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                    <span>📸 펜스 내부 올영/다이소:</span>
                    <span id="anchor_count" class="text-sm font-black text-emerald-600">-개</span>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full md:w-3/4 flex flex-col bg-slate-50 overflow-hidden relative">
        <div class="flex bg-white px-6 pt-3 border-b border-gray-200 overflow-x-auto whitespace-nowrap z-10">
            <button onclick="switchTab('map')" id="btn-map" class="tab-btn active px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📍 보행자 리얼 동선 지도</button>
            <button onclick="switchTab('radar')" id="btn-radar" class="tab-btn px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📊 입지 매력도</button>
        </div>

        <div id="tab-map" class="flex-grow w-full h-full relative">
            <div id="statusMessage" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 bg-white/95 backdrop-blur-sm px-6 py-2 rounded-full shadow-md text-sm font-bold text-slate-700 border border-slate-200 text-center transition-all">
                🎯 지도를 탐색 중입니다. (영토를 지정해야 입지 순위가 표시됩니다.)
            </div>

            <!-- 브랜드 필터 패널 (수량 카운터 연동) -->
            <div class="absolute top-16 left-4 z-10 bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-slate-200 w-64 max-h-[80vh] overflow-y-auto hidden md:block">
                <p class="text-xs font-extrabold text-slate-800 mb-2.5 border-b pb-1 flex justify-between"><span>🎯 렌즈 전문 브랜드</span><span class="text-slate-400">전국 누적</span></p>
                <div class="space-y-2 mb-4">
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lensme" onchange="triggerScan()" class="chk-purple" checked><span class="text-[13px] font-bold text-purple-700 flex-grow">🟣 렌즈미</span><span id="cnt_lensme" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olens" onchange="triggerScan()" class="chk-orange" checked><span class="text-[13px] font-bold text-orange-600 flex-grow">🟠 오렌즈</span><span id="cnt_olens" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_hapa" onchange="triggerScan()" class="chk-pink" checked><span class="text-[13px] font-bold text-pink-500 flex-grow">🌸 하파크리스틴</span><span id="cnt_hapa" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_winc" onchange="triggerScan()" class="chk-blue" checked><span class="text-[13px] font-bold text-blue-600 flex-grow">🔵 윙크렌즈</span><span id="cnt_winc" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_withlens" onchange="triggerScan()" class="chk-emerald" checked><span class="text-[13px] font-bold text-emerald-600 flex-grow">🟢 위드렌즈</span><span id="cnt_withlens" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lensvery" onchange="triggerScan()" class="chk-yellow" checked><span class="text-[13px] font-bold text-yellow-600 flex-grow">🟡 렌즈베리</span><span id="cnt_lensvery" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lenstown" onchange="triggerScan()" class="chk-red" checked><span class="text-[13px] font-bold text-red-600 flex-grow">🔴 렌즈타운</span><span id="cnt_lenstown" class="text-[12px] font-bold text-slate-500"></span></label>
                </div>
                <p class="text-xs font-extrabold text-slate-800 mb-2 border-b pb-1 mt-3 flex justify-between"><span>🌿 앵커 집객시설</span><span class="text-slate-400">전국 누적</span></p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olive_hapa" checked onchange="triggerScan()" class="chk-green"><span class="text-[13px] font-bold text-teal-700 flex-grow">🌿 올영(하파크리스틴)</span><span id="cnt_olive_hapa" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olive" checked onchange="triggerScan()" class="chk-green"><span class="text-[13px] font-bold text-green-600 flex-grow">🟩 일반 올리브영</span><span id="cnt_olive" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_daiso" checked onchange="triggerScan()" class="chk-red"><span class="text-[13px] font-bold text-rose-600 flex-grow">🟥 다이소</span><span id="cnt_daiso" class="text-[12px] font-bold text-slate-500"></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_davich" checked onchange="triggerScan()" class="chk-blue"><span class="text-[13px] font-bold text-blue-700 flex-grow">🟦 다비치안경</span><span id="cnt_davich" class="text-[12px] font-bold text-slate-500"></span></label>
                </div>
            </div>

            <div id="map" class="w-full h-full"></div>
        </div>

        <div id="tab-radar" class="hidden flex-grow w-full p-8 overflow-y-auto">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-2/3 bg-white p-4 rounded-xl shadow-sm border border-slate-200" style="height: 500px;"><div id="radarChart" class="w-full h-full"></div></div>
            </div>
        </div>
    </div>

    <!-- 로컬 카운트 데이터 로드 -->
    <script>
        let script = document.createElement('script');
        script.src = 'store_counts.js?v=' + new Date().getTime();
        script.onload = function() {
            if (typeof GLOBAL_COUNTS !== 'undefined') {
                const idMap = { 
                    'lensme': 'cnt_lensme', 'olens': 'cnt_olens', 'hapa': 'cnt_hapa',
                    'winc': 'cnt_winc', 'withlens': 'cnt_withlens', 'lensvery': 'cnt_lensvery', 'lenstown': 'cnt_lenstown',
                    'davich': 'cnt_davich', 'olive': 'cnt_olive', 'daiso': 'cnt_daiso', 'olive_hapa': 'cnt_olive_hapa' 
                };
                for(let key in idMap) {
                    let el = document.getElementById(idMap[key]);
                    if(el && GLOBAL_COUNTS[key] !== undefined) el.innerText = `(${GLOBAL_COUNTS[key]}개)`;
                }
            }
        };
        document.head.appendChild(script);
    </script>

    <!-- 카카오맵 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c045609510f8b75252389123f086be48&libraries=services,drawing"></script>

    <script>
        let mapContainer = document.getElementById('map'); 
        let currentCenter = new kakao.maps.LatLng(37.498095, 127.027610); 
        let searchCenter = currentCenter; 
        let map = new kakao.maps.Map(mapContainer, { center: currentCenter, level: 3 }); 
        
        let ps = new kakao.maps.services.Places(); 
        let geocoder = new kakao.maps.services.Geocoder();
        
        let mapMarkers = [];
        let rankOverlays = []; // 🥇🥈🥉 마커 저장 배열
        let placeCache = new Map();
        
        let tooltipOverlay = new kakao.maps.CustomOverlay({ xAnchor: 0.5, yAnchor: 1.5, zIndex: 150 });

        const BRAND_CONFIG = {
            f_lensme: { kw: '렌즈미', hex: '%239333ea', isComp: true },
            f_olens: { kw: '오렌즈', hex: '%23f97316', isComp: true },
            f_hapa: { kw: '하파크리스틴', hex: '%23f472b6', isComp: true },
            f_winc: { kw: '윙크 렌즈', hex: '%233b82f6', isComp: true },
            f_withlens: { kw: '위드렌즈', hex: '%23059669', isComp: true },
            f_lensvery: { kw: '렌즈베리', hex: '%23eab308', isComp: true },
            f_lenstown: { kw: '렌즈타운', hex: '%23dc2626', isComp: true }, 
            f_olive_hapa: { kw: '올리브영 하파크리스틴', hex: '%230f766e', isAnchor: true }, 
            f_olive: { kw: '올리브영', hex: '%2316a34a', isAnchor: true },
            f_daiso: { kw: '다이소', hex: '%23e11d48', isAnchor: true },
            f_davich: { kw: '다비치안경', hex: '%231d4ed8', isOther: true }
        };

        let drawingManager = new kakao.maps.drawing.DrawingManager({
            map: map, drawingMode: [kakao.maps.drawing.OverlayType.POLYGON],
            guideTooltip: ['그리기 시작: 클릭', '완료: 더블클릭'],
            polygonOptions: { draggable: false, removable: false, editable: true, strokeColor: '#be185d', strokeWeight: 3, fillColor: '#f43f5e', fillOpacity: 0.2 }
        });

        let savedPolygons = JSON.parse(localStorage.getItem('lensmePolygonsV4_8') || '[]');
        let activePolygonPath = null; 
        let activePolygonId = null;
        let renderedPolygons = {}; 
        let renderedNametags = {};
        let isDrawingMode = false;

        function startDrawing() {
            isDrawingMode = true;
            document.getElementById('btnStartDraw').classList.add('hidden');
            document.getElementById('btnSaveDraw').classList.remove('hidden');
            document.getElementById('btnCancelDraw').classList.remove('hidden');
            document.getElementById('statusMessage').innerText = "🖍️ 지도에 마우스를 클릭하여 상권 영토를 그리세요. (완료 시 더블클릭)";
            drawingManager.select(kakao.maps.drawing.OverlayType.POLYGON);
        }

        function cancelDrawing() {
            isDrawingMode = false;
            drawingManager.cancel();
            document.getElementById('btnStartDraw').classList.remove('hidden');
            document.getElementById('btnSaveDraw').classList.add('hidden');
            document.getElementById('btnCancelDraw').classList.add('hidden');
            document.getElementById('statusMessage').innerText = "지도를 탐색 중입니다.";
        }

        function saveDrawing() {
            let data = drawingManager.getData();
            if (data[kakao.maps.drawing.OverlayType.POLYGON].length === 0) {
                alert("그려진 다각형이 없습니다."); return;
            }
            let coords = data[kakao.maps.drawing.OverlayType.POLYGON][0].points;
            let name = prompt("이 상권 영토의 이름을 입력하세요:", "새 상권");
            
            if (name) {
                let sumLat = 0, sumLng = 0;
                coords.forEach(p => { sumLat += p.y; sumLng += p.x; });
                let centerLat = sumLat / coords.length;
                let centerLng = sumLng / coords.length;

                geocoder.coord2RegionCode(centerLng, centerLat, function(result, status) {
                    let si = "기타", gu = "기타", dong = "기타";
                    if (status === kakao.maps.services.Status.OK) {
                        let addr = result.find(r => r.region_type === 'B') || result[0];
                        si = addr.region_1depth_name;
                        gu = addr.region_2depth_name || "전체";
                        dong = addr.region_3depth_name;
                    }
                    
                    let id = 'poly_' + Date.now();
                    savedPolygons.push({ id: id, name: name, path: coords, si: si, gu: gu, dong: dong, centerLat: centerLat, centerLng: centerLng });
                    localStorage.setItem('lensmePolygonsV4_8', JSON.stringify(savedPolygons));
                    
                    drawingManager.clear();
                    cancelDrawing();
                    renderPolygonTree();
                    selectSavedPolygon(id); 
                });
            } else {
                drawingManager.clear(); cancelDrawing();
            }
        }

        function renderPolygonTree() {
            let treeEl = document.getElementById('savedPolygonTree');
            treeEl.innerHTML = '';
            Object.values(renderedPolygons).forEach(p => p.setMap(null));
            Object.values(renderedNametags).forEach(p => p.setMap(null));
            renderedPolygons = {}; renderedNametags = {};

            let treeData = {};
            savedPolygons.forEach(poly => {
                if(!treeData[poly.si]) treeData[poly.si] = {};
                if(!treeData[poly.si][poly.gu]) treeData[poly.si][poly.gu] = {};
                if(!treeData[poly.si][poly.gu][poly.dong]) treeData[poly.si][poly.gu][poly.dong] = [];
                treeData[poly.si][poly.gu][poly.dong].push(poly);
            });

            for (let si in treeData) {
                let detSi = document.createElement('details'); detSi.open = true;
                detSi.innerHTML = `<summary>${si}</summary><div class="tree-indent"></div>`;
                let divSi = detSi.querySelector('.tree-indent');
                
                for (let gu in treeData[si]) {
                    let detGu = document.createElement('details'); detGu.open = true;
                    detGu.innerHTML = `<summary>${gu}</summary><div class="tree-indent"></div>`;
                    let divGu = detGu.querySelector('.tree-indent');
                    
                    for (let dong in treeData[si][gu]) {
                        let polys = treeData[si][gu][dong];
                        let detDong = document.createElement('details'); detDong.open = true;
                        detDong.innerHTML = `<summary>${dong} <span class="text-rose-500 text-xs">(${polys.length})</span></summary><div class="tree-indent"></div>`;
                        let divDong = detDong.querySelector('.tree-indent');
                        
                        polys.forEach(poly => {
                            let item = document.createElement('div');
                            item.className = "flex justify-between items-center py-1 border-b border-gray-100 last:border-0";
                            item.innerHTML = `
                                <span class="font-bold text-rose-600 cursor-pointer hover:underline flex-grow" onclick="selectSavedPolygon('${poly.id}')">📍 ${poly.name}</span>
                                <div class="flex gap-1 ml-2">
                                    <button onclick="deletePolygon('${poly.id}')" class="text-[10px] bg-slate-200 px-1.5 py-0.5 rounded text-slate-600 hover:bg-slate-300">삭제</button>
                                </div>
                            `;
                            divDong.appendChild(item);

                            let path = poly.path.map(p => new kakao.maps.LatLng(p.y, p.x));
                            let polygon = new kakao.maps.Polygon({
                                path: path, strokeWeight: 2, strokeColor: '#be185d', strokeOpacity: 0.8, fillOpacity: 0.1, fillColor: '#f43f5e'
                            });
                            polygon.setMap(map);
                            kakao.maps.event.addListener(polygon, 'click', function() { selectSavedPolygon(poly.id); });
                            renderedPolygons[poly.id] = polygon;

                            let nametag = new kakao.maps.CustomOverlay({
                                position: new kakao.maps.LatLng(poly.centerLat, poly.centerLng),
                                content: `<div class="poly-nametag">${poly.name}</div>`,
                                xAnchor: 0.5, yAnchor: 0.5, zIndex: 80
                            });
                            nametag.setMap(map);
                            renderedNametags[poly.id] = nametag;
                        });
                        divGu.appendChild(detDong);
                    }
                    divSi.appendChild(detGu);
                }
                treeEl.appendChild(detSi);
            }
        }

        function deletePolygon(id) {
            if(!confirm("이 영토를 삭제하시겠습니까?")) return;
            savedPolygons = savedPolygons.filter(p => p.id !== id);
            localStorage.setItem('lensmePolygonsV4_8', JSON.stringify(savedPolygons));
            if(activePolygonId === id) clearActivePolygon();
            renderPolygonTree();
        }

        function selectSavedPolygon(id) {
            let poly = savedPolygons.find(p => p.id === id);
            if(!poly) return;

            activePolygonId = id;
            activePolygonPath = poly.path.map(p => new kakao.maps.LatLng(p.y, p.x));
            
            document.getElementById('targetLocationInput').innerText = `[${poly.dong}] ${poly.name}`;
            document.getElementById('btnClearPolygon').classList.remove('hidden');
            
            let bounds = new kakao.maps.LatLngBounds();
            activePolygonPath.forEach(p => bounds.extend(p));
            map.setBounds(bounds);
            searchCenter = bounds.getCenter();

            Object.values(renderedPolygons).forEach(p => p.setOptions({ fillColor: '#f43f5e', fillOpacity: 0.1, strokeWeight: 2 }));
            renderedPolygons[id].setOptions({ fillColor: '#ec4899', fillOpacity: 0.25, strokeWeight: 4 });
            Object.values(renderedNametags).forEach(n => n.setZIndex(80));
            renderedNametags[id].setZIndex(90);

            runTradeAreaAnalysis(); 
        }

        function clearActivePolygon() {
            activePolygonId = null;
            activePolygonPath = null;
            document.getElementById('targetLocationInput').innerText = "선택 없음 (자유 탐색)";
            document.getElementById('btnClearPolygon').classList.add('hidden');
            
            document.getElementById('comp_count').innerText = "-개";
            document.getElementById('anchor_count').innerText = "-개";

            Object.values(renderedPolygons).forEach(p => p.setOptions({ fillColor: '#f43f5e', fillOpacity: 0.1, strokeWeight: 2 }));
            triggerScan();
        }

        function isPointInPolygon(lat, lng, polygonPath) {
            let inside = false;
            for (let i = 0, j = polygonPath.length - 1; i < polygonPath.length; j = i++) {
                let xi = polygonPath[i].getLng(), yi = polygonPath[i].getLat();
                let xj = polygonPath[j].getLng(), yj = polygonPath[j].getLat();
                let intersect = ((yi > lat) != (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        kakao.maps.event.addListener(map, 'idle', function() {
            if(!isDrawingMode) scanMarkersInBounds(); 
        });

        let searchTimeout = null;
        function scanMarkersInBounds() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                let bounds = map.getBounds();
                let activeKeys = Object.keys(BRAND_CONFIG).filter(key => document.getElementById(key) && document.getElementById(key).checked);
                activeKeys.forEach(key => {
                    ps.keywordSearch(BRAND_CONFIG[key].kw, function(data, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            data.forEach(place => processPlaceAndDrawMarker(place, key));
                        }
                    }, { bounds: bounds, size: 15 });
                });
            }, 400);
        }

        function searchLocation() {
            let q = document.getElementById('searchInput').value.trim();
            if(!q) return;
            ps.keywordSearch(q, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    clearActivePolygon();
                    let place = data[0];
                    searchCenter = new kakao.maps.LatLng(place.y, place.x);
                    map.setCenter(searchCenter);
                    triggerScan();
                }
            });
        }

        function triggerScan() { 
            // 맵 마커는 지우고 다시 그립니다.
            placeCache.clear(); 
            mapMarkers.forEach(m => m.setMap(null)); mapMarkers = [];
            scanMarkersInBounds();
            runTradeAreaAnalysis(); 
        }

        function processPlaceAndDrawMarker(place, key) {
            if (placeCache.has(place.id)) return false; 
            let isDuplicate = false;
            let skipDeduplication = ['f_daiso', 'f_olive', 'f_olive_hapa'].includes(key);

            if (!skipDeduplication) {
                placeCache.forEach((existingItem) => {
                    if(existingItem.brand === key) {
                        let dist = getDistanceMeters(parseFloat(place.y), parseFloat(place.x), parseFloat(existingItem.rawData.y), parseFloat(existingItem.rawData.x));
                        if(dist <= 3) isDuplicate = true; 
                    }
                });
            }
            if (isDuplicate) return false;

            let cfg = BRAND_CONFIG[key];
            let svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="${cfg.hex}" stroke="white" stroke-width="2.5"/></svg>`;
            let markerImage = new kakao.maps.MarkerImage('data:image/svg+xml;utf-8,' + svgString, new kakao.maps.Size(24, 24), { offset: new kakao.maps.Point(12, 12) });
            
            let marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(place.y, place.x), image: markerImage });
            marker.setMap(map);
            mapMarkers.push(marker);
            placeCache.set(place.id, { brand: key, rawData: place, marker: marker });
            
            kakao.maps.event.addListener(marker, 'mouseover', function() {
                tooltipOverlay.setContent(`<div class="store-tooltip">${place.place_name}</div>`);
                tooltipOverlay.setPosition(marker.getPosition());
                tooltipOverlay.setMap(map);
            });
            kakao.maps.event.addListener(marker, 'mouseout', function() { tooltipOverlay.setMap(null); });
            
            return true;
        }

        // 💡 V4.8 하이브리드 엔진 & 랭킹 마커 전용 로직
        function runTradeAreaAnalysis() {
            // 랭킹 마커 및 툴팁 초기화
            rankOverlays.forEach(o => o.setMap(null)); 
            rankOverlays = [];
            tooltipOverlay.setMap(null);

            // 다각형이 활성화되지 않았다면 분석 중단 (마커만 놔둠)
            if (!activePolygonPath) {
                document.getElementById('statusMessage').innerText = "🎯 지도를 탐색 중입니다. (영토를 지정해야 입지 순위가 표시됩니다.)";
                return; 
            }

            document.getElementById('statusMessage').innerText = "🔎 영토 내부 가두리 정밀 분석 중 (3단계 하이브리드 엔진)...";
            
            let activeKeys = Object.keys(BRAND_CONFIG).filter(key => document.getElementById(key) && document.getElementById(key).checked);
            let anchorData = { olives: [], daisos: [], comps: [], allValidNodes: [] };

            // 영토 내 핀 필터링
            placeCache.forEach((item) => {
                let place = item.rawData;
                let key = item.brand;
                if (activeKeys.includes(key)) {
                    if (isPointInPolygon(parseFloat(place.y), parseFloat(place.x), activePolygonPath)) {
                        if(key === 'f_olive' || key === 'f_olive_hapa') anchorData.olives.push(place);
                        else if(key === 'f_daiso') anchorData.daisos.push(place);
                        else if(BRAND_CONFIG[key].isComp) anchorData.comps.push(place);
                        if(key !== 'f_davich') anchorData.allValidNodes.push(place);
                    }
                }
            });

            // 카운트 UI 업데이트
            document.getElementById('comp_count').innerText = anchorData.comps.length + '개';
            document.getElementById('anchor_count').innerText = (anchorData.olives.length + anchorData.daisos.length) + '개';
            drawRadarChart(anchorData.comps.length, (anchorData.olives.length + anchorData.daisos.length));

            // [1단계] 타겟 매장이 3개 이상이면 바로 랭킹 산출
            if (anchorData.allValidNodes.length >= 3) {
                calculateTop3Spots(anchorData.allValidNodes, "타겟 매장 밀집도 기준");
            } 
            // [2, 3단계] 타겟 매장이 부족하면 F&B 데이터를 호출하여 혼합 분석
            else {
                let bounds = new kakao.maps.LatLngBounds();
                activePolygonPath.forEach(p => bounds.extend(p));

                Promise.all([
                    new Promise(res => ps.categorySearch('CE7', (data, st) => res(st===kakao.maps.services.Status.OK ? data : []), {bounds: bounds, size:15})),
                    new Promise(res => ps.categorySearch('CS2', (data, st) => res(st===kakao.maps.services.Status.OK ? data : []), {bounds: bounds, size:15}))
                ]).then(results => {
                    let fnbNodes = [...results[0], ...results[1]].filter(place => isPointInPolygon(parseFloat(place.y), parseFloat(place.x), activePolygonPath));
                    
                    // 타겟 노드와 F&B 노드 병합 (중복 제거)
                    let combinedNodes = [...anchorData.allValidNodes, ...fnbNodes];
                    let uniqueNodes = Array.from(new Map(combinedNodes.map(item => [item.id, item])).values());
                    
                    if (uniqueNodes.length > 0) {
                        calculateTop3Spots(uniqueNodes, anchorData.allValidNodes.length > 0 ? "타겟+유동인구 혼합 기준" : "유동인구(F&B) 기준");
                    } else {
                        document.getElementById('statusMessage').innerText = "⚠️ 해당 영토 안에는 상업 시설 데이터가 전무합니다.";
                    }
                });
            }
        }

        // 🥇 🥈 🥉 랭킹 스팟 계산 및 마커 표시 함수
        function calculateTop3Spots(nodes, messageContext) {
            // 1. 밀집도(Density Score) 점수 계산
            nodes.forEach(node => {
                let score = 0;
                nodes.forEach(other => {
                    if (node.id !== other.id) {
                        let d = getDistanceMeters(parseFloat(node.y), parseFloat(node.x), parseFloat(other.y), parseFloat(other.x));
                        if (d <= 200) score += (200 - d); // 200m 이내 가중치
                    }
                });
                node.densityScore = score || 1; 
            });

            // 2. 점수 높은 순 정렬
            let sortedNodes = [...nodes].sort((a, b) => b.densityScore - a.densityScore);
            
            // 3. 거리 필터링을 통해 너무 붙어있지 않은 TOP 3 추출
            let topSpots = [];
            for (let i = 0; i < sortedNodes.length; i++) {
                let candidate = sortedNodes[i];
                let isTooClose = false;
                
                for (let selected of topSpots) {
                    if (getDistanceMeters(parseFloat(candidate.y), parseFloat(candidate.x), parseFloat(selected.y), parseFloat(selected.x)) < 30) {
                        isTooClose = true; break;
                    }
                }
                
                if (!isTooClose) {
                    topSpots.push(candidate);
                }
                if (topSpots.length >= 3) break;
            }

            // 4. 지도 위에 랭킹 마커 표시
            const rankStyles = [
                { title: '🥇 1급지', cls: 'rank-1', dotCls: 'rank-dot-1' },
                { title: '🥈 2급지', cls: 'rank-2', dotCls: 'rank-dot-2' },
                { title: '🥉 3급지', cls: 'rank-3', dotCls: 'rank-dot-3' }
            ];

            topSpots.forEach((spot, idx) => {
                let overlay = new kakao.maps.CustomOverlay({
                    position: new kakao.maps.LatLng(parseFloat(spot.y), parseFloat(spot.x)),
                    content: `<div class="rank-badge ${rankStyles[idx].cls}">${rankStyles[idx].title}</div><div class="rank-dot ${rankStyles[idx].dotCls}"></div>`,
                    xAnchor: 0.5, yAnchor: 0.5, zIndex: 300 - idx
                });
                overlay.setMap(map);
                rankOverlays.push(overlay);
            });

            document.getElementById('statusMessage').innerText = `✅ [${messageContext}] 영토 내 1, 2, 3위 입지 추출 완료!`;
        }

        // 거리 계산 유틸리티
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            let R = 6371000; 
            let dLat = (lat2-lat1)*(Math.PI/180), dLon = (lon2-lon1)*(Math.PI/180);
            let a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180))*Math.cos(lat2*(Math.PI/180))*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // 탭 전환 유틸리티
        function switchTab(tabId) {
            document.getElementById('tab-map').classList.add('hidden'); document.getElementById('tab-radar').classList.add('hidden');
            document.getElementById('btn-map').classList.remove('active'); document.getElementById('btn-radar').classList.remove('active');
            document.getElementById('tab-' + tabId).classList.remove('hidden'); document.getElementById('btn-' + tabId).classList.add('active');
            if(tabId === 'map') { map.relayout(); map.setCenter(map.getCenter()); }
            else if (tabId === 'radar') Plotly.Plots.resize(document.getElementById('radarChart')); 
        }

        // 방사형 차트
        function drawRadarChart(compCount=0, anchorScoreRaw=0) {
            let compScore = Math.max(10, 100 - (compCount * 8)); 
            let anchorScore = Math.min(100, 30 + (anchorScoreRaw * 15));
            let data = [
                { type: 'scatterpolar', r: [anchorScore+5, anchorScore, compScore, 65, anchorScore+5, anchorScore+5], theta: ['1030 유동인구', '타겟밀집', '경쟁강도', '임대료가성비', '상권활력', '1030 유동인구'], fill: 'toself', name: document.getElementById('targetLocationInput').innerText, line: {color: '#ec4899'}, fillcolor: 'rgba(236,72,153,0.4)' }
            ];
            Plotly.newPlot('radarChart', data, { polar: { radialaxis: {visible: true, range: [0, 100]} }, margin: {t:30, b:30}, legend: {orientation: "h", y: -0.2} }, {responsive: true, displayModeBar: false});
        }

        // 초기 세팅
        renderPolygonTree();
        triggerScan();
    </script>
