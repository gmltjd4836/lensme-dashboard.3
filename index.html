<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 800; }
        .tab-btn { color: #64748b; font-weight: 600; border-bottom: 4px solid transparent; }
        
        input[type=checkbox] { width: 1.1rem; height: 1.1rem; cursor: pointer; }
        .chk-purple { accent-color: #9333ea; } .chk-orange { accent-color: #f97316; } 
        .chk-red { accent-color: #dc2626; } .chk-green { accent-color: #16a34a; } 
        .chk-yellow { accent-color: #eab308; } .chk-pink { accent-color: #f472b6; } 
        .chk-blue { accent-color: #3b82f6; } .chk-emerald { accent-color: #059669; }

        .store-tooltip { background: #ffffff; border: 2px solid #334155; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: #0f172a; box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap; transform: translateY(-10px); z-index: 200;}
        .store-tooltip::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: #334155 transparent transparent transparent; }
        .poly-nametag { background: rgba(255, 255, 255, 0.95); border: 2px solid #be185d; border-radius: 8px; padding: 4px 10px; color: #be185d; font-size: 13px; font-weight: 900; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; white-space: nowrap; pointer-events: none; margin-top:-15px; margin-left: -50%; }

        details > summary { list-style: none; cursor: pointer; font-weight: 800; color: #334155; padding: 4px 0; font-size: 14px;}
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before { content: '📁 '; }
        details[open] > summary::before { content: '📂 '; }
        .tree-indent { margin-left: 16px; border-left: 2px dashed #cbd5e1; padding-left: 8px; }
    </style>
</head>

        <div class="mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">

                <p class="text-xs text-purple-800 font-extrabold mb-2">👑 기존 군락지 확인</p>

    <div class="w-full md:w-3/4 flex flex-col bg-slate-50 overflow-hidden relative">
        <div class="flex bg-white px-6 pt-3 border-b border-gray-200 overflow-x-auto whitespace-nowrap z-10">
            <button onclick="switchTab('map')" id="btn-map" class="tab-btn active px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📍 보행자 메인 동선 분석</button>
            <button onclick="switchTab('radar')" id="btn-radar" class="tab-btn px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📊 입지 매력도</button>
        </div>

        <div id="tab-map" class="flex-grow w-full h-full relative">
            <div id="statusMessage" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 bg-white/95 backdrop-blur-sm px-6 py-2 rounded-full shadow-md text-sm font-bold text-slate-700 border border-slate-200 text-center transition-all">
                🎯 펜스를 치면 [실제 보행로]를 먼저 도출한 후, 그 위에서만 V40 공식을 적용해 평가합니다!
            </div>

            <div class="absolute top-16 left-4 z-10 bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-slate-200 w-64 max-h-[80vh] overflow-y-auto hidden md:block">
                <p class="text-xs font-extrabold text-slate-800 mb-2.5 border-b pb-1"><span>🎯 렌즈 전문 브랜드</span></p>
                <div class="space-y-2 mb-4">
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lensme" onchange="triggerScan()" class="chk-purple" checked><span class="text-[13px] font-bold text-purple-700 flex-grow">🟣 렌즈미</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olens" onchange="triggerScan()" class="chk-orange" checked><span class="text-[13px] font-bold text-orange-600 flex-grow">🟠 오렌즈</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_hapa" onchange="triggerScan()" class="chk-pink" checked><span class="text-[13px] font-bold text-pink-500 flex-grow">🌸 하파크리스틴</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_winc" onchange="triggerScan()" class="chk-blue" checked><span class="text-[13px] font-bold text-blue-600 flex-grow">🔵 윙크렌즈</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_withlens" onchange="triggerScan()" class="chk-emerald" checked><span class="text-[13px] font-bold text-emerald-600 flex-grow">🟢 위드렌즈</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lenstown" onchange="triggerScan()" class="chk-red" checked><span class="text-[13px] font-bold text-red-600 flex-grow">🔴 렌즈타운</span></label>
                </div>
                <p class="text-xs font-extrabold text-slate-800 mb-2 border-b pb-1 mt-3"><span>🌿 핵심 집객시설</span></p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olive" checked onchange="triggerScan()" class="chk-green"><span class="text-[13px] font-bold text-green-600 flex-grow">🟩 올리브영</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_daiso" checked onchange="triggerScan()" class="chk-red"><span class="text-[13px] font-bold text-rose-600 flex-grow">🟥 다이소</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_davich" checked onchange="triggerScan()" class="chk-blue"><span class="text-[13px] font-bold text-blue-700 flex-grow">🟦 다비치안경</span></label>
                </div>
            </div>

            <div id="map" class="w-full h-full"></div>
        </div>

        <div id="tab-radar" class="hidden flex-grow w-full p-8 overflow-y-auto">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full bg-white p-4 rounded-xl shadow-sm border border-slate-200" style="height: 500px;"><div id="radarChart" class="w-full h-full"></div></div>
            </div>
        </div>
    </div>

    <!-- 카카오맵 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c045609510f8b75252389123f086be48&libraries=services,drawing"></script>

    <script>
        const TMAP_APP_KEY = "mJJ00gscCg39Y6nR0LhUw2yzrIfr7arY65OwUZYk"; 

        // ============================================================
        // [V40 공식 알고리즘 이식 영역]
        // ============================================================
        const LENS_SCORE_CONFIG = {
            NEW_STORE_EXCLUSION_DISTANCE: 50,
            WEIGHT: { COMMERCIAL_CENTER: 20, PEDESTRIAN_FLOW: 20, ACCESSIBILITY: 10, ATTRACTION: 20, LENS_MARKET: 20, VISIBILITY: 10 },
            ATTRACTION_BASE_WEIGHT: {
                "올리브영": 8, "백화점": 8, "대형쇼핑몰": 8, "대형마트": 7, "시장": 7, "다이소": 6, 
                "대학교": 5, "대형학원": 5, "버스터미널": 5, "대형숙박시설": 5, "일반카페": 2
            }
        };

        function getDistanceFactor(distance) {
            if (distance <= 20) return 1.00;
            if (distance <= 40) return 0.85;
            if (distance <= 60) return 0.65;
            if (distance <= 100) return 0.40;
            return 0;
        }

        function getPedestrianConnectionFactor(type) {
            switch (type) {
                case "same_route": return 1.00;
                case "connected": return 0.80;
                case "road_break": return 0.50;
                case "alley": return 0.20;
                case "separate": return 0.00;
                default: return 0.50;
            }
        }

        function calculateAttractionScore(facility) {
            const baseWeight = LENS_SCORE_CONFIG.ATTRACTION_BASE_WEIGHT[facility.type] || 0;
            const distanceFactor = getDistanceFactor(facility.distance);
            const pedestrianFactor = getPedestrianConnectionFactor(facility.connection);
            return baseWeight * distanceFactor * pedestrianFactor;
        }

        function calculateAttractionTotal(facilities) {
            if (!Array.isArray(facilities)) return 0;
            let total = 0;
            facilities.forEach(facility => { total += calculateAttractionScore(facility); });
            return Math.min(total, 20);
        }

        function checkExistingLensme(candidate, existingStores) {
            if (!Array.isArray(existingStores)) return { excluded: false, nearestDistance: null, risk: "정보없음" };
            let nearestDistance = Infinity;
            existingStores.forEach(store => {
                const distance = getDistanceMeters(candidate.lat, candidate.lng, store.lat, store.lng);
                if (distance < nearestDistance) nearestDistance = distance;
            });

            if (nearestDistance <= LENS_SCORE_CONFIG.NEW_STORE_EXCLUSION_DISTANCE) return { excluded: true, nearestDistance: nearestDistance, risk: "출점 제외" };
            if (nearestDistance <= 100) return { excluded: false, nearestDistance: nearestDistance, risk: "매우 높음" };
            if (nearestDistance <= 150) return { excluded: false, nearestDistance: nearestDistance, risk: "높음" };
            if (nearestDistance <= 200) return { excluded: false, nearestDistance: nearestDistance, risk: "보통" };
            return { excluded: false, nearestDistance: nearestDistance, risk: "낮음" };
        }

        function calculateNewStoreScore(data) {
            const lensmeCheck = checkExistingLensme(data.candidate, data.existingLensme);
            if (lensmeCheck.excluded) {
                return {
                    eligible: false, totalScore: 0, grade: "출점 제외",
                    exclusionReason: "기존 매장과 50m 이내",
                    lensmeRisk: lensmeCheck.risk, nearestLensmeDistance: lensmeCheck.nearestDistance
                };
            }

            const commercialCenter = clamp(data.commercialCenter || 0, 0, 20);
            const pedestrianFlow = clamp(data.pedestrianFlow || 0, 0, 20);
            const accessibility = clamp(data.accessibility || 0, 0, 10);
            const attraction = calculateAttractionTotal(data.attractions || []);
            const lensMarket = clamp(data.lensMarket || 0, 0, 20);
            const visibility = clamp(data.visibility || 0, 0, 10);

            const totalScore = commercialCenter + pedestrianFlow + accessibility + attraction + lensMarket + visibility;

            let grade;
            if (totalScore >= 85) grade = "A";
            else if (totalScore >= 70) grade = "B";
            else if (totalScore >= 55) grade = "C";
            else grade = "D";

            if (commercialCenter < 10 || pedestrianFlow < 10 || accessibility < 5) {
                if (grade === "A") grade = "B";
            }

            return {
                eligible: true, totalScore: Math.round(totalScore * 10) / 10, grade,
                breakdown: { commercialCenter, pedestrianFlow, accessibility, attraction, lensMarket, visibility },
                lensmeRisk: lensmeCheck.risk, nearestLensmeDistance: Math.round(lensmeCheck.nearestDistance)
            };
        }

        function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            let R = 6371000; 
            let dLat = (lat2-lat1)*(Math.PI/180), dLon = (lon2-lon1)*(Math.PI/180);
            let a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180))*Math.cos(lat2*(Math.PI/180))*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // ============================================================
        // 지도 및 대시보드 로직
        // ============================================================

        let mapContainer = document.getElementById('map'); 
        let currentCenter = new kakao.maps.LatLng(37.498095, 127.027610); 
        let map = new kakao.maps.Map(mapContainer, { center: currentCenter, level: 3 }); 
        let ps = new kakao.maps.services.Places(); 
        let geocoder = new kakao.maps.services.Geocoder();
        
        let mapMarkers = []; let rankOverlays = []; let placeCache = new Map(); 
        let tooltipOverlay = new kakao.maps.CustomOverlay({ xAnchor: 0.5, yAnchor: 1.5, zIndex: 150 });

        const BRAND_CONFIG = {
            f_lensme: { kw: '렌즈미', hex: '%239333ea', v40_type: '경쟁렌즈' },
            f_olens: { kw: '오렌즈', hex: '%23f97316', v40_type: '경쟁렌즈' },
            f_hapa: { kw: '하파크리스틴', hex: '%23f472b6', v40_type: '경쟁렌즈' },
            f_winc: { kw: '윙크 렌즈', hex: '%233b82f6', v40_type: '경쟁렌즈' },
            f_withlens: { kw: '위드렌즈', hex: '%23059669', v40_type: '경쟁렌즈' },
            f_lenstown: { kw: '렌즈타운', hex: '%23dc2626', v40_type: '경쟁렌즈' }, 
            f_olive: { kw: '올리브영', hex: '%2316a34a', v40_type: '올리브영' },
            f_daiso: { kw: '다이소', hex: '%23e11d48', v40_type: '다이소' },
            f_davich: { kw: '다비치안경', hex: '%231d4ed8', v40_type: '안경' }
        };

        let drawingManager = new kakao.maps.drawing.DrawingManager({
            map: map, drawingMode: [kakao.maps.drawing.OverlayType.POLYGON],
            guideTooltip: ['그리기 시작: 클릭', '완료: 더블클릭'],
            polygonOptions: { strokeColor: '#be185d', strokeWeight: 3, fillColor: '#f43f5e', fillOpacity: 0.2 }
        });

        let savedPolygons = JSON.parse(localStorage.getItem('lensmePolygonsV41') || '[]');
        let activePolygonPath = null; let activePolygonId = null;
        let renderedPolygons = {}; let isDrawingMode = false;
        let tempDrawnPath = null; let isScanningAPI = false;

        const delay = ms => new Promise(res => setTimeout(res, ms));

        drawingManager.addListener('drawend', function(data) {
            if (data.overlayType === kakao.maps.drawing.OverlayType.POLYGON) {
                let drawData = drawingManager.getData();
                let polygons = drawData[kakao.maps.drawing.OverlayType.POLYGON];
                let lastDrawn = polygons[polygons.length - 1]; 
                tempDrawnPath = lastDrawn.points.map(p => ({ lat: p.y, lng: p.x }));
                document.getElementById('btnStartDraw').classList.add('hidden');
                document.getElementById('btnSaveDraw').classList.remove('hidden');
                document.getElementById('btnCancelDraw').classList.remove('hidden');
                runGridHotspotScan(tempDrawnPath); 
            }
        });

        function startDrawing() {
            if(isScanningAPI) return;
            isDrawingMode = true; tempDrawnPath = null; clearActivePolygon(); 
            document.getElementById('btnStartDraw').classList.add('hidden');
            document.getElementById('btnSaveDraw').classList.remove('hidden');
            document.getElementById('btnCancelDraw').classList.remove('hidden');
            drawingManager.select(kakao.maps.drawing.OverlayType.POLYGON);
        }

        function cancelDrawing() {
            isDrawingMode = false; tempDrawnPath = null; drawingManager.clear(); clearRankMarkers(); 
            document.getElementById('btnStartDraw').classList.remove('hidden');
            document.getElementById('btnSaveDraw').classList.add('hidden');
            document.getElementById('btnCancelDraw').classList.add('hidden');
        }

        function saveDrawing() {
            if (!tempDrawnPath) return;
            let name = prompt("상권 영토의 이름을 입력하세요:", "새 상권");
            if (name) {
                let centerLat = tempDrawnPath.reduce((s, p) => s + p.lat, 0) / tempDrawnPath.length;
                let centerLng = tempDrawnPath.reduce((s, p) => s + p.lng, 0) / tempDrawnPath.length;
                let id = 'poly_' + Date.now();
                savedPolygons.push({ id, name, path: tempDrawnPath, si: "기타", gu: "기타", dong: "기타", centerLat, centerLng });
                localStorage.setItem('lensmePolygonsV41', JSON.stringify(savedPolygons));
                drawingManager.clear(); isDrawingMode = false;
                document.getElementById('btnStartDraw').classList.remove('hidden');
                document.getElementById('btnSaveDraw').classList.add('hidden');
                document.getElementById('btnCancelDraw').classList.add('hidden');
                renderPolygonTree(); selectSavedPolygon(id); 
            } else { cancelDrawing(); }
        }

        function renderPolygonTree() {
            let treeEl = document.getElementById('savedPolygonTree');
            treeEl.innerHTML = '';
            Object.values(renderedPolygons).forEach(p => p.setMap(null));
            renderedPolygons = {};
            savedPolygons.forEach(poly => {
                let item = document.createElement('div');
                item.className = "flex justify-between items-center py-1 border-b border-gray-100 p-2";
                item.innerHTML = `<span class="font-bold text-rose-600 cursor-pointer" onclick="selectSavedPolygon('${poly.id}')">📍 ${poly.name}</span>
                                  <button onclick="deletePolygon('${poly.id}')" class="text-[10px] bg-slate-200 px-1.5 py-0.5 rounded text-slate-600">삭제</button>`;
                treeEl.appendChild(item);
                let polygon = new kakao.maps.Polygon({ path: poly.path.map(p => new kakao.maps.LatLng(p.lat, p.lng)), strokeWeight: 2, strokeColor: '#be185d', fillOpacity: 0.1, fillColor: '#f43f5e' });
                polygon.setMap(map); kakao.maps.event.addListener(polygon, 'click', () => selectSavedPolygon(poly.id));
                renderedPolygons[poly.id] = polygon;
            });
        }

        function deletePolygon(id) {
            if(!confirm("삭제하시겠습니까?")) return;
            savedPolygons = savedPolygons.filter(p => p.id !== id);
            localStorage.setItem('lensmePolygonsV41', JSON.stringify(savedPolygons));
            if(activePolygonId === id) clearActivePolygon();
            renderPolygonTree();
        }

        function selectSavedPolygon(id) {
            let poly = savedPolygons.find(p => p.id === id);
            if(!poly) return;
            activePolygonId = id; activePolygonPath = poly.path; 
            document.getElementById('targetLocationInput').innerText = poly.name;
            document.getElementById('btnClearPolygon').classList.remove('hidden');
            let bounds = new kakao.maps.LatLngBounds();
            activePolygonPath.forEach(p => bounds.extend(new kakao.maps.LatLng(p.lat, p.lng)));
            map.setBounds(bounds);
            Object.values(renderedPolygons).forEach(p => p.setOptions({ fillColor: '#f43f5e', fillOpacity: 0.1 }));
            renderedPolygons[id].setOptions({ fillColor: '#ec4899', fillOpacity: 0.25 });
            runGridHotspotScan(activePolygonPath); 
        }

        function clearActivePolygon() {
            activePolygonId = null; activePolygonPath = null; tempDrawnPath = null;
            document.getElementById('targetLocationInput').innerText = "선택 없음 (자유 탐색)";
            document.getElementById('btnClearPolygon').classList.add('hidden');
            document.getElementById('rankingResultBox').classList.add('hidden');
            Object.values(renderedPolygons).forEach(p => p.setOptions({ fillColor: '#f43f5e', fillOpacity: 0.1 }));
            clearRankMarkers(); triggerScan();
        }

        function clearRankMarkers() { rankOverlays.forEach(o => o.setMap(null)); rankOverlays = []; }

        function isPointInPolygon(lat, lng, polygonPath) {
            let inside = false;
            for (let i = 0, j = polygonPath.length - 1; i < polygonPath.length; j = i++) {
                let xi = polygonPath[i].lng, yi = polygonPath[i].lat, xj = polygonPath[j].lng, yj = polygonPath[j].lat;
                if (((yi > lat) != (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
            }
            return inside;
        }

        async function triggerScan() { placeCache.clear(); mapMarkers.forEach(m => m.setMap(null)); mapMarkers = []; }

        function getAddressAsync(lat, lng) {
            return new Promise(resolve => {
                geocoder.coord2Address(lng, lat, (result, status) => {
                    resolve(status === kakao.maps.services.Status.OK ? (result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name) : "펜스 내 핵심 구간");
                });
            });
        }

        async function fetchTmapPedestrianRoute(startX, startY, endX, endY) {
            try {
                const response = await fetch('https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'appKey': TMAP_APP_KEY },
                    body: JSON.stringify({ startX, startY, endX, endY, reqCoordType: "WGS84GEO", resCoordType: "WGS84GEO", startName: "출발", endName: "도착" })
                });
                return (await response.json()).features;
            } catch (e) { return null; }
        }

        async function drawTmapPedestrianStreet(spot, idx, map, polygonPath) {
            let color = idx === 0 ? '#ef4444' : (idx === 1 ? '#3b82f6' : '#10b981');
            
            // 시각적 강조를 위한 십자가 
            let dLat = 0.0002; let dLng = 0.00025;
            let p1 = [new kakao.maps.LatLng(spot.lat - dLat, spot.lng), new kakao.maps.LatLng(spot.lat + dLat, spot.lng)];
            let p2 = [new kakao.maps.LatLng(spot.lat, spot.lng - dLng), new kakao.maps.LatLng(spot.lat, spot.lng + dLng)];
            [p1, p2].forEach(p => { let pl = new kakao.maps.Polyline({path: p, strokeWeight: 8, strokeColor: color, strokeOpacity: 0.5}); pl.setMap(map); rankOverlays.push(pl); });
            return { type: 'cross' };
        }

        // ============================================================
        // V41 코어: 선 추출 ➡️ 점 평가 로직
        // ============================================================
        async function runGridHotspotScan(targetPath) {
            if(isScanningAPI) return;
            isScanningAPI = true;
            clearRankMarkers();
            document.getElementById('rankingResultBox').classList.add('hidden');
            let statusEl = document.getElementById('statusMessage');
            
            try {
                let cLat = targetPath.reduce((s,p)=>s+p.lat,0)/targetPath.length;
                let cLng = targetPath.reduce((s,p)=>s+p.lng,0)/targetPath.length;
                let centerPos = new kakao.maps.LatLng(cLat, cLng);

                let rawScannedNodes = []; let rawGates = [];
                let existingLensme = []; let validAnchors = [];
                let seenIds = {};

                statusEl.innerText = `🚇 주변 유입구(지하철/정류장) 및 핵심 인프라 수집 중...`;
                await new Promise(resolve => {
                    ps.categorySearch('SW8', function(data, status) {
                        if (status === kakao.maps.services.Status.OK) data.forEach(d => rawGates.push({ lat: parseFloat(d.y), lng: parseFloat(d.x) }));
                        resolve();
                    }, { location: centerPos, radius: 1500 });
                });
                await new Promise(resolve => {
                    ps.keywordSearch('버스정류장', function(data, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            for(let k=0; k<Math.min(data.length, 5); k++) rawGates.push({ lat: parseFloat(data[k].y), lng: parseFloat(data[k].x) });
                        }
                        resolve();
                    }, { location: centerPos, radius: 1000 });
                });

                let activeKeys = Object.keys(BRAND_CONFIG);
                for (let i = 0; i < activeKeys.length; i++) {
                    let key = activeKeys[i];
                    await new Promise(resolve => {
                        ps.keywordSearch(BRAND_CONFIG[key].kw, function(data, status) {
                            if (status === kakao.maps.services.Status.OK) {
                                data.forEach(place => {
                                    if(!seenIds[place.id]) {
                                        seenIds[place.id] = true; place.v40_type = BRAND_CONFIG[key].v40_type; 
                                        rawScannedNodes.push(place);
                                        if (key === 'f_lensme') existingLensme.push({ lat: parseFloat(place.y), lng: parseFloat(place.x) });
                                    }
                                });
                            }
                            resolve(); 
                        }, { location: centerPos, radius: 1000, size: 15 });
                    });
                    await delay(50);
                }

                let validNodes = rawScannedNodes.filter(p => isPointInPolygon(parseFloat(p.y), parseFloat(p.x), targetPath));
                validNodes.forEach(p => { if (p.v40_type === '올리브영' || p.v40_type === '다이소') validAnchors.push({ lat: parseFloat(p.y), lng: parseFloat(p.x) }); });

                // 💡 [V41.0 핵심] 선(Path) 먼저 찾기
                statusEl.innerText = `🌐 [V41] TMAP 메인 보행로 선(Path) 추출 및 후보군 생성 중...`;
                let gridPoints = []; 

                // 가장 가까운 유입구 2개, 가장 가까운 앵커 2개 선정 (총 4개 루트 API 호출)
                let topGates = rawGates.sort((a,b) => getDistanceMeters(a.lat, a.lng, cLat, cLng) - getDistanceMeters(b.lat, b.lng, cLat, cLng)).slice(0, 2);
                let topAnchors = validAnchors.sort((a,b) => getDistanceMeters(a.lat, a.lng, cLat, cLng) - getDistanceMeters(b.lat, b.lng, cLat, cLng)).slice(0, 2);

                if (TMAP_APP_KEY && topGates.length > 0 && topAnchors.length > 0) {
                    for (let g of topGates) {
                        for (let a of topAnchors) {
                            let features = await fetchTmapPedestrianRoute(g.lng, g.lat, a.lng, a.lat);
                            if (features) {
                                features.forEach(f => {
                                    if (f.geometry.type === "LineString") {
                                        f.geometry.coordinates.forEach(coord => {
                                            let pLat = coord[1]; let pLng = coord[0];
                                            // 💡 해당 보행로가 펜스 안에 들어왔을 때만 후보지 '점'으로 변환
                                            if (isPointInPolygon(pLat, pLng, targetPath)) {
                                                // 중복/밀집 방지 (15m 간격)
                                                let tooClose = gridPoints.some(pt => getDistanceMeters(pt.lat, pt.lng, pLat, pLng) < 15);
                                                if (!tooClose) gridPoints.push({ lat: pLat, lng: pLng });
                                            }
                                        });
                                    }
                                });
                            }
                            await delay(100);
                        }
                    }
                }

                // TMAP 실패 시 폴백 (기존 바둑판)
                if(gridPoints.length === 0) {
                    let minLat=90, maxLat=-90, minLng=180, maxLng=-180;
                    targetPath.forEach(p => { minLat=Math.min(minLat, p.lat); maxLat=Math.max(maxLat, p.lat); minLng=Math.min(minLng, p.lng); maxLng=Math.max(maxLng, p.lng); });
                    let stepLat = (maxLat - minLat)/20, stepLng = (maxLng - minLng)/20;
                    for(let lat = minLat; lat <= maxLat; lat += stepLat) {
                        for(let lng = minLng; lng <= maxLng; lng += stepLng) {
                            if(isPointInPolygon(lat, lng, targetPath)) gridPoints.push({ lat, lng });
                        }
                    }
                }

                statusEl.innerText = `⚖️ 진짜 보행로 위에서 V40 공식 채점 중...`;
                let evaluatedSpots = [];

                gridPoints.forEach(pt => {
                    let candidate = { lat: pt.lat, lng: pt.lng };
                    let attractions = [];
                    let anchorCount = 0; let compCount = 0;

                    validNodes.forEach(node => {
                        let distance = getDistanceMeters(pt.lat, pt.lng, parseFloat(node.y), parseFloat(node.x));
                        if(node.v40_type === '올리브영' || node.v40_type === '다이소') anchorCount++;
                        if(node.v40_type === '경쟁렌즈') compCount++;
                        attractions.push({
                            type: node.v40_type === '올리브영' ? '올리브영' : (node.v40_type === '다이소' ? '다이소' : '일반카페'),
                            distance: distance,
                            connection: distance <= 40 ? "same_route" : "connected"
                        });
                    });

                    let dataInput = {
                        candidate: candidate, existingLensme: existingLensme,
                        commercialCenter: Math.min(20, anchorCount * 5),
                        pedestrianFlow: Math.min(20, (anchorCount+compCount) * 3 + 5),
                        accessibility: Math.min(10, 8),
                        attractions: attractions,
                        lensMarket: Math.min(20, compCount * 7),
                        visibility: 8
                    };

                    let result = calculateNewStoreScore(dataInput);
                    if (result.eligible) { pt.v40Result = result; evaluatedSpots.push(pt); }
                });

                evaluatedSpots.sort((a, b) => b.v40Result.totalScore - a.v40Result.totalScore);
                
                let topSpots = [];
                for(let i=0; i<evaluatedSpots.length; i++) {
                    let candidate = evaluatedSpots[i];
                    let tooClose = topSpots.some(t => getDistanceMeters(candidate.lat, candidate.lng, t.lat, t.lng) < 40);
                    if(!tooClose && topSpots.length < 3) topSpots.push(candidate);
                }

                let rBox = document.getElementById('rankingResultText');
                if (topSpots.length > 0) {
                    let rankingHtml = "";
                    for (let idx = 0; idx < topSpots.length; idx++) {
                        let spot = topSpots[idx];
                        let res = spot.v40Result;
                        let addrName = await getAddressAsync(spot.lat, spot.lng);
                        await drawTmapPedestrianStreet(spot, idx, map, targetPath);
                        let rankTitle = idx === 0 ? '1위' : (idx===1 ? '2위' : '3위');
                        let color = idx === 0 ? 'text-red-600' : (idx===1 ? 'text-blue-600' : 'text-emerald-600');
                        let bgColor = idx === 0 ? '#ef4444' : (idx===1 ? '#3b82f6' : '#10b981');

                        rankingHtml += `
                        <div class="bg-white px-3 py-3 rounded-xl border border-slate-200 shadow-sm mb-3">
                            <div class="flex justify-between items-end border-b border-slate-100 pb-1.5 mb-1.5">
                                <span class="text-[15px] font-black ${color}">💎 ${rankTitle} 입지 <span class="text-slate-800 ml-1">${res.totalScore}점 (${res.grade}등급)</span></span>
                            </div>
                            <div class="text-[12px] text-slate-600 mb-2 font-bold tracking-tight">📍 ${addrName} 주변</div>
                            
                            <div class="flex flex-col gap-1 text-[11px] mb-2 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                <div class="flex justify-between font-bold text-slate-500"><span>출점 가능 여부:</span><span class="text-indigo-600 font-black">가능 (팀킬: ${res.lensmeRisk}, ${res.nearestLensmeDistance}m)</span></div>
                            </div>
                            
                            <div class="bg-indigo-50/80 p-2.5 rounded-lg text-[11px] border border-indigo-100 grid grid-cols-2 gap-x-2 gap-y-1">
                                <div class="flex justify-between text-slate-700"><span>🏢 상권중심:</span><span class="font-bold">${res.breakdown.commercialCenter}점</span></div>
                                <div class="flex justify-between text-slate-700"><span>🚶 동선흐름:</span><span class="font-bold">${res.breakdown.pedestrianFlow}점</span></div>
                                <div class="flex justify-between text-slate-700"><span>🎯 집객시설:</span><span class="font-bold">${Math.round(res.breakdown.attraction*10)/10}점</span></div>
                                <div class="flex justify-between text-slate-700"><span>👁️ 렌즈시장:</span><span class="font-bold">${res.breakdown.lensMarket}점</span></div>
                                <div class="flex justify-between text-slate-700"><span>🚦 접근성:</span><span class="font-bold">${res.breakdown.accessibility}점</span></div>
                                <div class="flex justify-between text-slate-700"><span>👀 가시성:</span><span class="font-bold">${res.breakdown.visibility}점</span></div>
                            </div>
                        </div>
                        `;

                        let badgeStr = `<div style="position:relative; z-index:999; text-align:center;"><div style="background:${bgColor}; color:white; padding:4px 10px; border-radius:6px; font-weight:900; font-size:12px; border:2px solid white; box-shadow:0 3px 6px rgba(0,0,0,0.3); white-space:nowrap;">💎 ${rankTitle} 입지 (${res.grade})</div></div>`;
                        let badgeOverlay = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(spot.lat, spot.lng), content: badgeStr, xAnchor: 0.5, yAnchor: 0.5 });
                        badgeOverlay.setMap(map); rankOverlays.push(badgeOverlay);
                    }
                    rBox.innerHTML = rankingHtml;
                } else {
                    rBox.innerHTML = `<div class="text-xs text-rose-600 font-bold mt-1">⚠️ 출점 가능한 입지가 없습니다.</div>`;
                }

                document.getElementById('rankingResultBox').classList.remove('hidden');
                statusEl.innerText = `✅ V41 분석 완료! 진짜 보행로 위에서 V40 공식 채점을 마쳤습니다.`;

            } catch(e) {
                console.error("분석 에러:", e);
                statusEl.innerText = "⚠️ 분석 중 에러가 발생했습니다.";
            } finally {
                isScanningAPI = false;
            }
        }

        function switchTab(tabId) {
            document.getElementById('tab-map').classList.add('hidden'); document.getElementById('tab-radar').classList.add('hidden');
            document.getElementById('btn-map').classList.remove('active'); document.getElementById('btn-radar').classList.remove('active');
            document.getElementById('tab-' + tabId).classList.remove('hidden'); document.getElementById('btn-' + tabId).classList.add('active');
            if(tabId === 'map') { map.relayout(); map.setCenter(map.getCenter()); }
        }

        renderPolygonTree(); triggerScan();
    </script>
</body>
