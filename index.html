<script>
/* ===== LensMe V59.1 PATCH =====
   - 구버전 저장상권 TOP3 우선 복원 + 재분석 실패 시 기존 TOP3 유지
   - 분석 오류 실제 메시지 표시
   - 올리브영/다이소 제외 렌즈 브랜드·다비치 전국수집
   - 같은 브랜드의 샵인샵/중복 카카오 등록을 실제 1개 매장으로 통합
   - 전국 마커/수량에 같은 중복제거 결과 사용
   - 올리브영 내 하파크리스틴: 기존 확인점 + 명시적 공동브랜드 검색 자동보강
*/
(()=>{
const V591_KEYS=[
"f_lensme",
"f_olens",
"f_hapa",
"f_winc",
"f_withlens",
"f_lensvery",
"f_lenstown",
"f_davich"
];

const V591_COUNT_ID={
f_lensme:"lensme",
f_olens:"olens",
f_hapa:"hapa",
f_winc:"winc",
f_withlens:"withlens",
f_lensvery:"lensvery",
f_lenstown:"lenstown",
f_davich:"davich"
};

const V591_REGIONS=[
 {q:"서울",aliases:["서울특별시","서울"]},
 {q:"부산",aliases:["부산광역시","부산"]},
 {q:"대구",aliases:["대구광역시","대구"]},
 {q:"인천",aliases:["인천광역시","인천"]},
 {q:"광주",aliases:["광주광역시","광주"]},
 {q:"대전",aliases:["대전광역시","대전"]},
 {q:"울산",aliases:["울산광역시","울산"]},
 {q:"세종",aliases:["세종특별자치시","세종"]},
 {q:"경기",aliases:["경기도","경기"]},
 {q:"강원",aliases:["강원특별자치도","강원도","강원"]},
 {q:"충북",aliases:["충청북도","충북"]},
 {q:"충남",aliases:["충청남도","충남"]},
 {q:"전북",aliases:["전북특별자치도","전라북도","전북"]},
 {q:"전남",aliases:["전라남도","전남"]},
 {q:"경북",aliases:["경상북도","경북"]},
 {q:"경남",aliases:["경상남도","경남"]},
 {q:"제주",aliases:["제주특별자치도","제주"]}
];

const V591_STORE_KEY="lensmeNationwideBrandsV59_1";
const V591_STORE_TTL=7*24*60*60*1000;
const V591_HAPA_OLIVE_KEY="lensmeHapaOliveV59_1";

const v591Cache=new Map();
const v591Loading=new Map();

let v591Store={};

try{
 const x=JSON.parse(localStorage.getItem(V591_STORE_KEY)||"{}");
 if(x&&typeof x==="object")v591Store=x;
}catch(e){}


/* =========================================================
   기본 텍스트 / 브랜드 판별
========================================================= */

function v591Clean(v){
 return String(v||"")
 .replace(/\s+/g,"")
 .replace(/[()\[\]{}·ㆍ,._-]/g,"")
 .toLowerCase();
}

function v591Word(key){
 return ({
  f_lensme:"렌즈미",
  f_olens:"오렌즈",
  f_hapa:"하파크리스틴",
  f_winc:"윙크",
  f_withlens:"위드렌즈",
  f_lensvery:"렌즈베리",
  f_lenstown:"렌즈타운",
  f_davich:"다비치"
 })[key]||"";
}

function v591KeyByKeyword(keyword){
 const q=v591Clean(keyword);

 if(q==="렌즈미")return "f_lensme";
 if(q==="오렌즈")return "f_olens";
 if(q==="하파크리스틴")return "f_hapa";
 if(q==="윙크렌즈")return "f_winc";
 if(q==="위드렌즈")return "f_withlens";
 if(q==="렌즈베리")return "f_lensvery";
 if(q==="렌즈타운")return "f_lenstown";
 if(q==="다비치안경"||q==="다비치")return "f_davich";

 return null;
}

function v591Matches(key,row){
 const name=v591Clean(row?.place_name);

 if(!name)return false;

 if(key==="f_lensme")
  return name.includes("렌즈미");

 if(key==="f_olens")
  return name.includes("오렌즈");

 if(key==="f_hapa")
  return name.includes("하파크리스틴")&&!name.includes("올리브영");

 if(key==="f_winc")
  return name.includes("윙크")&&(name.includes("렌즈")||name.includes("콘택트"));

 if(key==="f_withlens")
  return name.includes("위드렌즈");

 if(key==="f_lensvery")
  return name.includes("렌즈베리");

 if(key==="f_lenstown")
  return name.includes("렌즈타운");

 if(key==="f_davich")
  return name.includes("다비치");

 return true;
}


/* =========================================================
   실제 물리매장 중복 판별
========================================================= */

function v591Dist(a,b){
 const ay=+a?.y;
 const ax=+a?.x;
 const by=+b?.y;
 const bx=+b?.x;

 return [ay,ax,by,bx].every(Number.isFinite)
 ? Pt(ay,ax,by,bx)
 : Infinity;
}

function v591SamePhysical(a,b){

 if(!a||!b)return false;

 /* 같은 카카오 Place ID */
 if(
  a.id &&
  b.id &&
  String(a.id)===String(b.id)
 ){
  return true;
 }

 const d=v591Dist(a,b);

 const ar=v591Clean(a.road_address_name);
 const br=v591Clean(b.road_address_name);

 const aj=v591Clean(a.address_name);
 const bj=v591Clean(b.address_name);

 /* 같은 도로명주소 + 20m 이내 */
 if(
  ar &&
  br &&
  ar===br &&
  d<=20
 ){
  return true;
 }

 /* 같은 지번주소 + 20m 이내 */
 if(
  aj &&
  bj &&
  aj===bj &&
  d<=20
 ){
  return true;
 }

 /* 주소가 다르게 등록되어도 거의 같은 좌표 */
 if(d<=8){
  return true;
 }

 return false;
}


/* =========================================================
   중복 등록 중 대표 매장명 선택
========================================================= */

function v591RepScore(key,row){

 const raw=String(row?.place_name||"").trim();

 const name=v591Clean(raw);
 const brand=v591Clean(v591Word(key));

 let s=0;

 /* 렌즈미 XX점 같은 브랜드 직접등록 우선 */
 if(
  brand &&
  name.startsWith(brand)
 ){
  s+=7;
 }

 if(
  brand &&
  name.includes(brand)
 ){
  s+=3;
 }

 if(/점$/.test(raw)){
  s+=2;
 }

 /* OO안경 렌즈미보다 렌즈미 OO점 우선 */
 if(
  /안경|옵틱|아이웨어/.test(raw) &&
  !name.startsWith(brand)
 ){
  s-=1;
 }

 s+=Math.max(
  0,
  3-Math.min(3,raw.length/16)
 );

 return s;
}


/* =========================================================
   브랜드 검색결과 중복제거
========================================================= */

function v591Normalize(key,rows){

 const idSeen=new Set();
 const raw=[];

 for(const row of rows||[]){

  if(!v591Matches(key,row)){
   continue;
  }

  const id=String(
   row.id ||
   `${row.place_name}|${Number(row.x).toFixed(6)}|${Number(row.y).toFixed(6)}`
  );

  if(idSeen.has(id)){
   continue;
  }

  idSeen.add(id);
  raw.push(row);
 }

 const groups=[];

 for(const row of raw){

  let g=groups.find(
   x=>v591SamePhysical(x[0],row)
  );

  if(!g){
   g=[];
   groups.push(g);
  }

  g.push(row);
 }

 return groups.map(g=>{

  const arr=[...g].sort(
   (a,b)=>
   v591RepScore(key,b)-
   v591RepScore(key,a)
  );

  const rep={...arr[0]};

  rep.v591Aliases=[
   ...new Set(
    g.map(r=>
     String(r.place_name||"").trim()
    ).filter(Boolean)
   )
  ];

  rep.v591DuplicateCount=
   Math.max(0,g.length-1);

  return rep;
 });
}


/* =========================================================
   전국 캐시용 경량 데이터
========================================================= */

function v591Compact(r){

 return {
  id:r.id||"",
  place_name:r.place_name||"",
  x:String(r.x||""),
  y:String(r.y||""),
  address_name:r.address_name||"",
  road_address_name:r.road_address_name||"",
  phone:r.phone||"",
  place_url:r.place_url||"",
  category_name:r.category_name||"",
  v591Aliases:r.v591Aliases||[],
  v591DuplicateCount:r.v591DuplicateCount||0
 };
}


/* =========================================================
   시도 필터
========================================================= */

function v591InRegion(row,reg){

 const addr=
 `${row?.road_address_name||""} ${row?.address_name||""}`
 .trim();

 if(!addr){
  return true;
 }

 return reg.aliases.some(
  a=>
  addr.startsWith(a)||
  addr.includes(` ${a} `)
 );
}


/* =========================================================
   카카오 검색 모든 페이지 수집
========================================================= */

function v591KeywordAll(keyword,maxPages=45){

 return new Promise(resolve=>{

  const ps=
  new kakao.maps.services.Places();

  let rows=[];
  let pages=0;
  let totalCount=0;
  let done=false;

  const timer=setTimeout(
   ()=>finish(true),
   45000
  );

  function finish(failed=false){

   if(done)return;

   done=true;
   clearTimeout(timer);

   resolve({
    rows,
    totalCount,
    pages,
    failed,
    truncated:
     !failed &&
     pages>=maxPages &&
     rows.length<totalCount
   });
  }

  function cb(
   data,
   status,
   pagination
  ){

   if(done)return;

   if(
    status===
    kakao.maps.services.Status.ZERO_RESULT
   ){
    return finish(false);
   }

   if(
    status!==
    kakao.maps.services.Status.OK
   ){
    return finish(true);
   }

   pages++;

   rows.push(
    ...(data||[])
   );

   totalCount=Math.max(
    totalCount,
    Number(
     pagination?.totalCount
    )||rows.length
   );

   if(
    pagination?.hasNextPage &&
    pages<maxPages
   ){

    setTimeout(()=>{

     try{
      pagination.nextPage();
     }catch(e){
      finish(true);
     }

    },45);

   }else{

    finish(false);

   }
  }

  try{

   ps.keywordSearch(
    keyword,
    cb,
    {size:15}
   );

  }catch(e){

   finish(true);

  }
 });
}


/* =========================================================
   왼쪽 브랜드 수량 표시
========================================================= */

function v591SetCount(key,n){

 const id=
 V591_COUNT_ID[key];

 const el=
 id&&
 document.getElementById(
  "cnt_"+id
 );

 if(!el)return;

 el.innerText=
 n==null
 ? "(-)"
 : `(${Number(n).toLocaleString()}개)`;

 el.classList.remove(
  "text-blue-500"
 );

 el.classList.add(
  "text-slate-500"
 );
}


/* =========================================================
   전국 데이터 저장
========================================================= */

function v591Save(key,rows){

 v591Store[key]={
  savedAt:Date.now(),
  rows:(rows||[]).map(v591Compact)
 };

 try{

  localStorage.setItem(
   V591_STORE_KEY,
   JSON.stringify(v591Store)
  );

 }catch(e){

  console.warn(
   "전국 브랜드 캐시 저장 실패",
   e
  );

 }
}


/* =========================================================
   브랜드 전국 수집
========================================================= */

async function v591Collect(key){

 const meta=J[key];

 if(!meta?.kw){
  return [];
 }

 let rows=[];

 for(
  let idx=0;
  idx<V591_REGIONS.length;
  idx++
 ){

  const reg=
  V591_REGIONS[idx];

  const el=
  document.getElementById(
   "cnt_"+
   (V591_COUNT_ID[key]||"")
  );

  if(el){

   el.innerText=
   `전국수집 ${idx+1}/${V591_REGIONS.length}`;

  }

  const res=
  await v591KeywordAll(
   `${meta.kw} ${reg.q}`,
   45
  );

  rows.push(
   ...(res.rows||[])
   .filter(
    r=>v591InRegion(r,reg)
   )
  );

  await new Promise(
   r=>setTimeout(r,35)
  );
 }

 /* 지역검색 결과가 전부 실패한 경우 */
 if(!rows.length){

  const res=
  await v591KeywordAll(
   meta.kw,
   45
  );

  rows.push(...res.rows);
 }

 return v591Normalize(
  key,
  rows
 );
}


/* =========================================================
   전국 데이터 가져오기
========================================================= */

async function v591Ensure(key){

 if(v591Cache.has(key)){
  return v591Cache.get(key);
 }

 if(v591Loading.has(key)){
  return v591Loading.get(key);
 }

 const p=(async()=>{

  const rows=
  await v591Collect(key);

  v591Cache.set(
   key,
   rows
  );

  v591SetCount(
   key,
   rows.length
  );

  v591Save(
   key,
   rows
  );

  return rows;

 })().finally(
  ()=>v591Loading.delete(key)
 );

 v591Loading.set(
  key,
  p
 );

 return p;
}


/* =========================================================
   전국 브랜드 지도에 표시
========================================================= */

function v591Render(key){

 for(
  const row of
  v591Cache.get(key)||[]
 ){

  jt(row,key);

 }
}

function v591RenderChecked(){

 for(
  const key of
  V591_KEYS
 ){

  if(
   document
   .getElementById(key)
   ?.checked &&
   v591Cache.has(key)
  ){

   v591Render(key);

  }
 }

 A.forEach(
  ({marker,brand})=>{

   try{

    marker.setMap(
     document
     .getElementById(brand)
     ?.checked
     ?f
     :null
    );

   }catch(e){}

  }
 );
}


/* =========================================================
   전국 캐시 복원
========================================================= */

function v591RestoreCache(){

 const now=Date.now();

 for(
  const key of
  V591_KEYS
 ){

  const rec=
  v591Store?.[key];

  if(
   rec?.savedAt &&
   Array.isArray(rec.rows) &&
   now-rec.savedAt<
   V591_STORE_TTL
  ){

   v591Cache.set(
    key,
    rec.rows
   );

   v591SetCount(
    key,
    rec.rows.length
   );

  }
 }
}


/* =========================================================
   지도 마커 자체 중복제거
========================================================= */

const v591OriginalJt=jt;

jt=function(
 row,
 key,
 color
){

 if(
  V591_KEYS.includes(key)
 ){

  for(
   const rec of
   A.values()
  ){

   if(
    rec?.brand===key &&
    v591SamePhysical(
     rec.rawData,
     row
    )
   ){

    return false;

   }
  }
 }

 return v591OriginalJt(
  row,
  key,
  color
 );
};


/* =========================================================
   기존 Z 검색함수 보강

   분석할 때도 렌즈미/타사를
   같은 실제매장 기준으로 중복 제거
========================================================= */

const v591OriginalZ=Z;

Z=async function(
 keyword,
 opts={},
 pages=e.ANALYSIS_MAX_PAGES
){

 const rows=
 await v591OriginalZ(
  keyword,
  opts,
  pages
 );

 const key=
 v591KeyByKeyword(
  keyword
 );

 if(!key){
  return rows;
 }

 const cleaned=
 v591Normalize(
  key,
  rows
 );

 cleaned.queryMeta=
 rows.queryMeta;

 return cleaned;
};


/* =========================================================
   지도 이동 후에도 전국마커 다시 유지

const v591OriginalHt=Ht;

Ht=async function(){

 try{

/* =========================================================
   올리브영 내 하파크리스틴
========================================================= */

function v591ExplicitHapaOlive(row){

 const n=
 v591Clean(
  row?.place_name
 );

 return (
  n.includes("하파크리스틴") &&
  n.includes("올리브영")
 );
}


/* 자동 신규점 탐색 */
async function v591DiscoverHapaOlive(){

 let out=[];

 for(
  const reg of
  V591_REGIONS
 ){

  const queries=[
   `하파크리스틴 올리브영 ${reg.q}`,
   `올리브영 하파크리스틴 ${reg.q}`
  ];

  for(
   const q of queries
  ){

   const res=
   await v591KeywordAll(
    q,
    4
   );

   out.push(
    ...(res.rows||[])
    .filter(
     r=>
     v591InRegion(r,reg) &&
     v591ExplicitHapaOlive(r)
    )
   );

   await new Promise(
    r=>setTimeout(r,25)
   );
  }
 }

 return out;
}


/* 기존 확인지점 + 자동탐지 합치기 */
async function v591ResolveHapaOlive(){

 const now=Date.now();

 try{

  const cache=
  JSON.parse(
   localStorage.getItem(
    V591_HAPA_OLIVE_KEY
   )||"null"
  );

  if(
   cache?.savedAt &&
   Array.isArray(cache.rows) &&
   now-cache.savedAt<
   V591_STORE_TTL
  ){

   const el=
   document.getElementById(
    "cnt_olive_hapa"
   );

   if(el){
    el.textContent=
    `(${cache.rows.length}곳)`;
   }

   return cache.rows;
  }

 }catch(e){}


 const known=[];

 for(
  const branch of
  V575_HAPA_OLIVE_BRANCHES||[]
 ){

  let found=null;

  for(
   const q of
   branch.queries||[]
  ){

   found=
   await v575KeywordOne(q);

   if(found){
    break;
   }

   await new Promise(
    r=>setTimeout(r,18)
   );
  }

  if(found){

   known.push({
    ...found,

    id:
    `hapaolive_${branch.id}`,

    place_name:
    `🌿 하파 입점 · ${branch.label}`,

    brandKey:
    "f_olive_hapa",

    verifiedBranch:true
   });
  }
 }


 let auto=[];

 try{

  auto=
  await v591DiscoverHapaOlive();

 }catch(e){

  console.warn(
   "올영 내 하파 자동탐지 실패",
   e
  );

 }


 const all=[
  ...known,
  ...auto
 ];

 const groups=[];

 for(
  const row of all
 ){

  let g=
  groups.find(
   x=>
   v591SamePhysical(
    x[0],
    row
   )
  );

  if(!g){
   g=[];
   groups.push(g);
  }

  g.push(row);
 }


 const rows=
 groups.map(
  (g,idx)=>{

   const verified=
   g.find(
    x=>x.verifiedBranch
   );

   const rep={
    ...(verified||g[0])
   };

   rep.id=
   String(
    rep.id||
    `hapaolive_${idx}_${rep.x}_${rep.y}`
   );

   rep.brandKey=
   "f_olive_hapa";

   if(!verified){

    rep.place_name=
    `🌿 올영 내 하파 · ${rep.place_name}`;

   }

   return rep;
  }
 );


 try{

  localStorage.setItem(
   V591_HAPA_OLIVE_KEY,
   JSON.stringify({
    savedAt:Date.now(),
    rows:rows.map(v591Compact)
   })
  );

 }catch(e){}


 const el=
 document.getElementById(
  "cnt_olive_hapa"
 );

 if(el){
  el.textContent=
  `(${rows.length}곳)`;
 }

 return rows;
}


/* 기존 하파 올영 함수 교체 */
v575ResolveHapaOliveBranches=
v591ResolveHapaOlive;


/* 상권 반경 / 현재 지도범위 필터는 기존처럼 유지 */
v575HapaOliveForView=
async function({
 bounds=null,
 location=null,
 radius=null
}={}){

 const rows=
 await v591ResolveHapaOlive();

 if(bounds){

  return rows.filter(r=>{

   try{

    return bounds.contain(
     new kakao.maps.LatLng(
      +r.y,
      +r.x
     )
    );

   }catch(e){

    return true;

   }
  });
 }

 if(
  location &&
  Number.isFinite(radius)
 ){

  const lat=
  location.getLat
  ?location.getLat()
  :location.lat;

  const lng=
  location.getLng
  ?location.getLng()
  :location.lng;

  return rows.filter(
   r=>
   Pt(
    lat,
    lng,
    +r.y,
    +r.x
   )<=radius
  );
 }

 return rows;
};

/* =========================================================
   분석 오류 방어

   기존 순위가 있는 상태에서
   새 분석 실패 → 기존 TOP3 복구
========================================================= */

const v591OriginalCe=ce;

ce=async function(
 path,
 opts={}
){

 const fallback=
 opts.fallbackCache||null;

 const areaId=
 opts.fallbackAreaId||null;

 let captured=null;

 const oldErr=
 console.error;

 console.error=(...args)=>{

  try{

   if(
    String(
     args[0]||""
    )
    .includes(
     "분석 에러"
    )
   ){

    captured=
    args[1]||
    args[0];

   }

  }catch(e){}

  oldErr.apply(
   console,
   args
  );
 };


 let result;

 try{

  result=
  await v591OriginalCe(
   path
  );

 }finally{

  console.error=
  oldErr;

 }


 const ok=
 !!(
  i?.topSegments
  ?.length
 );


 /* 재분석 실패 +
    기존 저장 TOP3 있음 */
 if(
  !ok &&
  fallback
  ?.analysis
  ?.topSegments
  ?.length &&
  areaId
 ){

  try{

   savedAreaAnalysisCache.set(
    String(areaId),
    fallback
   );

   v566RestoreCachedAnalysis(
    fallback,
    path,
    areaId
   );

   applyMapDisplayFilters();

  }catch(e){

   console.warn(
    "기존 TOP3 복원 실패",
    e
   );

  }


  const detail=
  String(
   captured?.message||
   captured||
   "재분석 실패"
  )
  .slice(0,130);


  document
  .getElementById(
   "statusMessage"
  )
  .innerText=
  `⚠️ 새 분석 오류 · ${detail} · 기존 저장 TOP3는 유지했습니다.`;

 }


 /* 신규 분석 자체 오류 */
 else if(
  !ok &&
  captured
 ){

  document
  .getElementById(
   "statusMessage"
  )
  .innerText=
  `⚠️ 분석 오류 · ${
   String(
    captured?.message||
    captured
   ).slice(0,140)
  }`;

 }

 return ok||result;
};


/* =========================================================
   구버전 저장상권 호환

   옛날 TOP3만 있는 상권:
   1. 순위 먼저 표시
   2. 유입/유동인구 재분석
   3. 실패해도 옛 TOP3 유지
========================================================= */

v580EnsureSavedAreaAnalysis;

){

 const persistent=

  )

  /* 뒤에서 새 분석 */
  setTimeout(
   async()=>{

    if(
     T ||
     expandedSavedAreaId==null ||
     String(
      expandedSavedAreaId
     )!==String(key) ||
     !selectedSavedAreaIds
     .has(
      String(key)
     )
    ){
     return;
    }


    const ok=
    await ce(
     [
      ...path.map(
       p=>({...p})
      )
     ],
     {
      fallbackCache:
      persistent,

      fallbackAreaId:
      String(key)
     }
    );


    /* 성공했을 때만
       새 스냅샷으로 교체 */
    if(
     ok &&
     i?.topSegments
     ?.length
    ){

     const html=
     document
     .getElementById(

     )
     ?.innerHTML||"";


     savedAreaAnalysisCache.set(

       fenceKey:

       analysis:i,

       html
      }
     );


     v581PersistAreaAnalysis(
      String(key),
      v564FenceKey(path),
      i,
      html,
      path
     );


     v586RenderAllSelectedSavedAreas(
      String(key)
     );


     document
     .getElementById(
      "statusMessage"
     )
     .innerText=
     `${area.name} · 기존 TOP3 유지 + 유입·유동인구 갱신 완료.`;

    }

   },
   120
  );


  return true;
 }


 /* 최신 데이터는 기존 로직 사용 */
 return v591OriginalEnsureSaved(
  key,
  area,
  path
 );
};
