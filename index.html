<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌즈미 상권 분석 (GeoJSON 분할 로딩 & 1~3순위 골든존)</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 800; }
        .tab-btn { color: #64748b; font-weight: 600; border-bottom: 4px solid transparent; }
        input[type=checkbox] { width: 1.1rem; height: 1.1rem; cursor: pointer; }
        .chk-purple { accent-color: #9333ea; } .chk-orange { accent-color: #f97316; } 
        .chk-red { accent-color: #dc2626; } .chk-green { accent-color: #16a34a; } 
        .chk-blue { accent-color: #3b82f6; } .chk-gray { accent-color: #9ca3af; }

        /* 골든존 애니메이션 */
        @keyframes pulse-gold { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 25px rgba(250, 204, 21, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); } }
        .rank-1-marker { animation: pulse-gold 2s infinite; background: linear-gradient(135deg, #fde047 0%, #eab308 100%); border: 3px solid #fff; border-radius: 30px; padding: 4px 12px; color: #713f12; font-size: 15px; font-weight: 900; text-shadow: 0px 1px 1px rgba(255,255,255,0.8); box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 100; white-space: nowrap;}
        .rank-2-marker { background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%); border: 2px solid #fff; border-radius: 20px; padding: 3px 10px; color: #1e293b; font-size: 13px; font-weight: 800; box-shadow: 0 3px 5px rgba(0,0,0,0.3); z-index: 90; white-space: nowrap;}
        .rank-3-marker { background: linear-gradient(135deg, #fed7aa 0%, #ea580c 100%); border: 2px solid #fff; border-radius: 20px; padding: 3px 10px; color: #fff; font-size: 13px; font-weight: 800; box-shadow: 0 3px 5px rgba(0,0,0,0.3); z-index: 80; white-space: nowrap;}
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen text-slate-800">

    <!-- 1. 좌측 사이드바 -->
    <div class="w-full md:w-1/4 bg-white border-r border-gray-200 p-6 flex flex-col shadow-lg z-20 overflow-y-auto">
        <h1 class="text-2xl font-extrabold text-slate-800 border-b-4 border-indigo-500 pb-3 mb-6">
            🗺️ 실전 상권 분석기
        </h1>
        
        <!-- 🌟 사이드바 드릴다운 UI -->
        <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <label class="block text-sm font-extrabold text-indigo-700 mb-2">🎯 지역 줌인 (스무스 이동)</label>
            <p id="drillDownStatus" class="text-xs font-bold text-slate-500 mb-3 border-b pb-2"></p>
            <div id="drillDownUI" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="mt-2 bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
            <p class="text-xs text-slate-500 font-bold mb-1">현재 기준 매장명</p>
            <input type="text" id="currentStoreInput" value="현재 매장" class="w-full bg-slate-50 border border-gray-300 px-3 py-2 rounded-md font-semibold text-sm mb-3" oninput="updateStoreNames()">
            <p class="text-xs text-slate-500 font-bold mb-1">분석 대상 상권 (목적지)</p>
            <input type="text" id="targetLocationInput" value="상권을 선택하세요" class="w-full bg-slate-50 border border-indigo-300 px-3 py-2 rounded-md font-extrabold text-indigo-600 text-lg" readonly>
        </div>
    </div>

    <!-- 2. 우측 메인 화면 -->
    <div class="w-full md:w-3/4 flex flex-col bg-slate-50 overflow-hidden">
        
        <div class="flex bg-white px-6 pt-4 border-b border-gray-200 overflow-x-auto whitespace-nowrap z-10">
            <button onclick="switchTab('map')" id="btn-map" class="tab-btn active px-4 py-2 mr-4 text-lg hover:text-indigo-500 transition">📍 골든존 지도</button>
            <button onclick="switchTab('radar')" id="btn-radar" class="tab-btn px-4 py-2 mr-4 text-lg hover:text-indigo-500 transition">📊 입지 매력도</button>
        </div>

        <!-- 탭 1: 카카오맵 -->
        <div id="tab-map" class="flex-grow w-full h-full relative">
            <div id="statusMessage" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 bg-white/95 backdrop-blur-sm px-6 py-2 rounded-full shadow-md text-sm font-bold text-slate-700 border border-slate-200 text-center transition-all">
                👆 왼쪽 메뉴에서 지역을 선택해 주세요.
            </div>

            <!-- 전국 오피셜 수량 고정 필터 -->
            <div class="absolute top-16 left-4 z-10 bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-slate-200 w-56 max-h-[80vh] overflow-y-auto">
                <p class="text-xs text-slate-400 font-bold mb-1 text-right">오피셜 DB</p>
                <p class="text-sm font-extrabold text-slate-800 mb-3 border-b pb-2">🎯 렌즈 브랜드</p>
                <div class="space-y-3 mb-4">
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_lensme" onchange="refreshMarkers()" checked><span class="text-[14px] font-bold text-purple-700">🟣 렌즈미</span></div></label>
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_olens" onchange="refreshMarkers()" checked><span class="text-[14px] font-bold text-orange-600">🟠 오렌즈</span></div></label>
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_hapa" onchange="refreshMarkers()" checked><span class="text-[14px] font-bold text-pink-500">🌸 하파크리스틴</span></div></label>
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_winc" onchange="refreshMarkers()" checked><span class="text-[14px] font-bold text-blue-500">🔵 윙크렌즈</span></div></label>
                </div>
                <p class="text-sm font-extrabold text-slate-800 mb-2 border-b pb-2 mt-4">🌿 샵인샵 / 앵커</p>
                <div class="space-y-2 mb-4">
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_olive_shop" checked onchange="refreshMarkers()"><span class="text-[13px] font-bold text-green-700">🌿 올영 입점(렌즈)</span></div></label>
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_olive" checked onchange="refreshMarkers()"><span class="text-[13px] font-bold text-green-600">🟩 올리브영</span></div></label>
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_daiso" checked onchange="refreshMarkers()"><span class="text-[13px] font-bold text-red-500">🟥 다이소</span></div></label>
                    <label class="flex justify-between"><div class="flex space-x-2"><input type="checkbox" id="f_other" checked onchange="refreshMarkers()"><span class="text-[13px] font-bold text-gray-500">⚪ 안경원</span></div></label>
                </div>
            </div>
            <div id="map" class="w-full h-full"></div>
        </div>

        <!-- 탭 2: 레이더 차트 -->
        <div id="tab-radar" class="hidden flex-grow w-full p-8 overflow-y-auto">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-lg mb-2">🏪 <b>현재:</b> <span class="currentStoreName font-bold"></span></p>
                    <p class="text-lg mb-2">🚩 <b>후보:</b> <span class="targetLocationName text-pink-500 font-bold"></span></p>
                    <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 mt-4 space-y-2">
                        <p class="text-sm text-slate-700">⚔️ 경쟁 안경/렌즈샵: <span id="comp_count" class="text-lg font-extrabold text-pink-600 ml-1">0</span>개</p>
                        <p class="text-sm text-slate-700">📸 올영/다이소: <span id="anchor_count" class="text-lg font-extrabold text-green-600 ml-1">0</span>개</p>
                    </div>
                </div>
                <div class="w-full md:w-2/3 bg-white p-4 rounded-xl shadow-sm border border-slate-200" style="height: 500px;"><div id="radarChart" class="w-full h-full"></div></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c045609510f8b75252389123f086be48&libraries=services"></script>
    
    <script>
        // 🌟 1. 뼈대 지역 데이터 (세부 상권은 GeoJSON에서 자동으로 불러옴)
        const regionHierarchy = {
            "서울": { lat: 37.5665, lng: 126.9780, level: 9, children: { "강남구": { lat: 37.4959, lng: 127.0664, level: 6 }, "마포구": { lat: 37.5662, lng: 126.9016, level: 6 } }},
            "인천": { lat: 37.4562, lng: 126.7052, level: 9, children: { "부평구": { lat: 37.5070, lng: 126.7215, level: 6 } }},
            "경기": { lat: 37.2752, lng: 127.0095, level: 10, children: { "수원시": { lat: 37.2635, lng: 127.0286, level: 7 }, "구리시": { lat: 37.5943, lng: 127.1296, level: 6 } }},
            "부산": { lat: 35.1795, lng: 129.0756, level: 9, children: { "부산진구": { lat: 35.1627, lng: 129.0531, level: 7 } }}
        };

        // 🚨 사장님이 데이터 올리기 전까지 테스트할 수 있도록 만든 샘플 데이터 (부평구)
        const sampleGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "상권명": "부평 문화의거리", "시군구": "부평구" }, "geometry": { "type": "Polygon", "coordinates": [[[126.7215, 37.4938], [126.7210, 37.4920], [126.7240, 37.4918], [126.7245, 37.4940]]] } },
                { "type": "Feature", "properties": { "상권명": "부평 테마의거리", "시군구": "부평구" }, "geometry": { "type": "Polygon", "coordinates": [[[126.7240, 37.4918], [126.7235, 37.4900], [126.7265, 37.4895], [126.7270, 37.4915]]] } }
            ]
        };

        let mapContainer = document.getElementById('map'); 
        let map = new kakao.maps.Map(mapContainer, { center: new kakao.maps.LatLng(36.5, 127.5), level: 12 }); 
        let ps = new kakao.maps.services.Places(); 
        
        let placeCache = new Map(); 
        let targetAnchors = []; 
        let searchTimeout = null;
        let goldenZoneMarkers = []; 
        let activePolygons = []; // 화면에 그려진 다각형들

        // --- 🌟 드릴다운(줌인) 로직 ---
        function renderDrillDown(level, parentObj = null, parentName = "", grandParentName = "") {
            let container = document.getElementById('drillDownUI');
            container.innerHTML = '';

            if (level === 1) {
                document.getElementById('drillDownStatus').innerText = "1단계: 도/광역시 선택";
                for(let prov in regionHierarchy) {
                    let btn = document.createElement('button');
                    btn.className = "px-3 py-1 bg-indigo-50 text-indigo-700 text-sm font-bold rounded-lg border border-indigo-200 hover:bg-indigo-600 hover:text-white transition";
                    btn.innerText = prov;
                    btn.onclick = () => { 
                        map.panTo(new kakao.maps.LatLng(regionHierarchy[prov].lat, regionHierarchy[prov].lng)); 
                        map.setLevel(regionHierarchy[prov].level); 
                        renderDrillDown(2, regionHierarchy[prov].children, prov); 
                    };
                    container.appendChild(btn);
                }
            } else if (level === 2) {
                document.getElementById('drillDownStatus').innerText = `2단계: ${parentName} 산하 시/군/구 선택`;
                let btnBack = document.createElement('button'); btnBack.className = "px-3 py-1 bg-gray-200 text-gray-700 text-sm font-bold rounded-lg mr-2"; btnBack.innerText = "🔙 지역 리셋"; btnBack.onclick = () => { map.setLevel(12); clearPolygons(); renderDrillDown(1); }; container.appendChild(btnBack);
                for(let city in parentObj) {
                    let btn = document.createElement('button'); btn.className = "px-3 py-1 bg-blue-50 text-blue-700 text-sm font-bold rounded-lg border border-blue-200 hover:bg-blue-600 hover:text-white transition"; btn.innerText = city;
                    btn.onclick = () => { 
                        map.panTo(new kakao.maps.LatLng(parentObj[city].lat, parentObj[city].lng)); 
                        map.setLevel(parentObj[city].level); 
                        // 🌟 핵심: 여기서 외부 GeoJSON 파일을 불러와 상권 버튼을 자동 생성합니다!
                        loadCommercialAreasGeoJSON(parentName, city);
                    };
                    container.appendChild(btn);
                }
            } else if (level === 3) {
                document.getElementById('drillDownStatus').innerText = `3단계: ${parentName} 핵심 상권 진입!`;
                let btnBack = document.createElement('button'); btnBack.className = "px-3 py-1 bg-gray-200 text-gray-700 text-sm font-bold rounded-lg mr-2"; btnBack.innerText = "🔙 처음으로"; btnBack.onclick = () => { map.setLevel(12); clearPolygons(); renderDrillDown(1); }; container.appendChild(btnBack);
                
                // GeoJSON에서 추출된 상권 목록(parentObj)으로 버튼 생성
                parentObj.forEach(feature => {
                    let town = feature.properties.상권명;
                    let btn = document.createElement('button'); btn.className = "px-3 py-1 bg-pink-50 text-pink-700 text-sm font-extrabold rounded-lg border border-pink-300 hover:bg-pink-600 hover:text-white transition shadow-sm"; btn.innerText = town;
                    btn.onclick = () => { focusOnPolygon(feature); };
                    container.appendChild(btn);
                });
            }
        }

        // --- 🌟 비동기 GeoJSON 로딩 및 파싱 (분할 방식) ---
        async function loadCommercialAreasGeoJSON(provName, cityName) {
            document.getElementById('statusMessage').innerText = `⏳ ${cityName} 상권 데이터를 불러오는 중...`;
            clearPolygons();
            let geoData = null;

            try {
                // 깃허브에 업로드할 파일 경로 (예: data/인천.geojson)
                let response = await fetch(`data/${provName}.geojson`);
                if (!response.ok) throw new Error("파일 없음");
                geoData = await response.json();
            } catch (e) {
                // 사장님이 아직 파일을 안 올리셨을 때, 에러 방지용 샘플 데이터 제공 (인천 부평구 한정)
                if(cityName === "부평구") {
                    console.log("샘플 부평구 데이터 로드");
                    geoData = sampleGeoJSON;
                } else {
                    document.getElementById('statusMessage').innerText = `⚠️ 깃허브 data 폴더에 ${provName}.geojson 파일이 필요합니다.`;
                    document.getElementById('statusMessage').classList.replace('text-slate-700', 'text-red-600');
                    return;
                }
            }

            // 가져온 도(道) 데이터 안에서 클릭한 '시/구'에 해당하는 상권만 필터링
            let targetFeatures = geoData.features.filter(f => f.properties.시군구 === cityName);
            
            if(targetFeatures.length === 0) {
                document.getElementById('statusMessage').innerText = `⚠️ ${cityName} 지역에 등록된 상권이 없습니다.`;
                return;
            }

            document.getElementById('statusMessage').innerText = `✅ 상권 모양 스캔 완료! 분석할 골목을 선택하세요.`;
            document.getElementById('statusMessage').classList.replace('text-red-600', 'text-slate-700');
            
            // 지도에 다각형 그리기 및 3단계 버튼 생성
            drawPolygons(targetFeatures);
            renderDrillDown(3, targetFeatures, cityName, provName);
        }

        function clearPolygons() {
            activePolygons.forEach(p => p.polygon.setMap(null));
            activePolygons = [];
            goldenZoneMarkers.forEach(m => m.setMap(null));
            goldenZoneMarkers = [];
        }

        function drawPolygons(features) {
            features.forEach(feature => {
                let path = feature.geometry.coordinates[0].map(coord => new kakao.maps.LatLng(coord[1], coord[0])); // GeoJSON은 [경도,위도] 순서임
                let polygon = new kakao.maps.Polygon({
                    path: path, strokeWeight: 3, strokeColor: '#94a3b8', strokeOpacity: 0.8, strokeStyle: 'dashed', fillColor: '#cbd5e1', fillOpacity: 0.1
                });
                
                // 지도에서 상권 폴리곤을 직접 터치해도 작동하도록 이벤트 추가
                kakao.maps.event.addListener(polygon, 'click', function() { focusOnPolygon(feature); });
                
                polygon.setMap(map);
                activePolygons.push({ name: feature.properties.상권명, polygon: polygon, feature: feature });
            });
        }

        // 특정 상권 버튼이나 폴리곤을 클릭했을 때 작동
        function focusOnPolygon(targetFeature) {
            let targetName = targetFeature.properties.상권명;
            document.getElementById('targetLocationInput').value = targetName;
            updateStoreNames();

            let targetPolyObj = null;
            let bounds = new kakao.maps.LatLngBounds();

            activePolygons.forEach(p => {
                if (p.name === targetName) {
                    p.polygon.setOptions({ strokeColor: '#ec4899', strokeStyle: 'solid', fillColor: '#ec4899', fillOpacity: 0.15, strokeWeight: 4 });
                    targetPolyObj = p.polygon;
                    // 폴리곤의 모든 좌표를 bounds에 추가하여 중앙값 찾기
                    p.polygon.getPath().forEach(coord => bounds.extend(coord));
                } else {
                    // 선택 안 된 곳은 회색으로 흐리게
                    p.polygon.setOptions({ strokeColor: '#94a3b8', strokeStyle: 'dashed', fillColor: '#cbd5e1', fillOpacity: 0.1, strokeWeight: 2 });
                }
            });

            if (targetPolyObj) {
                map.setBounds(bounds); // 해당 상권 모양에 꽉 차게 줌인!
                setTimeout(() => { scanGoldenZoneInPolygon(targetPolyObj); }, 500); // 줌인 후 1~3순위 골든존 스캔
            }
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            let R = 6371000; 
            let dLat = (lat2-lat1) * (Math.PI/180); let dLon = (lon2-lon1) * (Math.PI/180);
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- 🌟 실시간 렌즈 매장 스캔 (5m 중복 제거 유지) ---
        kakao.maps.event.addListener(map, 'idle', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(searchPlacesInView, 600); 
        });

        function searchPlacesInView() {
            if(map.getLevel() > 5) return; 
            let bounds = map.getBounds(); 
            let searchKeywords = ['렌즈미', '오렌즈', '하파크리스틴', '윙크 렌즈', '렌즈타운', '안경'];
            let completedSearches = 0;
            
            searchKeywords.forEach(kw => {
                ps.keywordSearch(kw, function(data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(p => createMarkerWithDeduplication(p));
                    }
                    completedSearches++;
                    if(completedSearches === searchKeywords.length) refreshMarkers(); 
                }, { bounds: bounds, size: 15 });
            });
        }

        function createMarkerWithDeduplication(place) {
            if (placeCache.has(place.id)) return;
            let n = place.place_name.toLowerCase();
            let blackList = ['노래', '주점', 'pc', '스터디', '당구', '룸', '뮤직', '호프', '파티', '마사지', '휴게', '바', 'bar'];
            let isBad = false; blackList.forEach(bw => { if(n.includes(bw)) isBad = true; });
            if (isBad && !n.includes('안경')) return; 

            let bType = 'other', cHex = '%239ca3af', iText = '⚪';
            if (n.includes('렌즈미')) { bType = 'lensme'; cHex = '%239333ea'; iText = '🟣'; }
            else if (n.includes('오렌즈')) { bType = 'olens'; cHex = '%23f97316'; iText = '🟠'; }
            else if (n.includes('하파크리스틴')) { bType = n.includes('올리브영') ? 'olive_shop' : 'hapa'; cHex = n.includes('올리브영')?'%2322c55e':'%23f472b6'; iText = n.includes('올리브영')?'🌿':'🌸'; }
            else if (n.includes('윙크') || n.includes('winc')) { bType = n.includes('올리브영') ? 'olive_shop' : 'winc'; cHex = n.includes('올리브영')?'%2322c55e':'%233b82f6'; iText = n.includes('올리브영')?'🌿':'🔵'; }
            else if (n.includes('렌즈타운')) { bType = 'lenstown'; cHex = '%23dc2626'; iText = '🔴'; }
            else if (n.includes('안경')) { bType = 'other'; } else return;

            let isDuplicate = false;
            placeCache.forEach((existingItem) => {
                if(existingItem.brand === bType && getDistanceMeters(place.y, place.x, existingItem.rawData.y, existingItem.rawData.x) < 5) isDuplicate = true;
            });
            if(isDuplicate) return;

            let strokeColor = bType === 'olive_shop' ? "%2322c55e" : "white";
            let strokeWidth = bType === 'olive_shop' ? "4" : "2.5";
            let svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="${cHex}" stroke="${strokeColor}" stroke-width="${strokeWidth}"/></svg>`;
            let markerImage = new kakao.maps.MarkerImage('data:image/svg+xml;utf-8,' + svgString, new kakao.maps.Size(24, 24), { offset: new kakao.maps.Point(12, 12) });
            let marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(place.y, place.x), image: markerImage, title: place.place_name });
            let infowindow = new kakao.maps.InfoWindow({ content: `<div style="padding:5px;font-size:12px;font-weight:bold;">${iText} ${place.place_name}</div>` });
            
            kakao.maps.event.addListener(marker, 'mouseover', function() { infowindow.open(map, marker); });
            kakao.maps.event.addListener(marker, 'mouseout', function() { infowindow.close(); });
            placeCache.set(place.id, { brand: bType, marker: marker, pos: marker.getPosition(), rawData: place });
        }

        // --- 👑 선택된 폴리곤(상권) 내부 1~3순위 골든존 스캔 ---
        function scanGoldenZoneInPolygon(polygonObj) {
            document.getElementById('statusMessage').innerText = "👑 상권 1~3순위 추천 입지 분석 중...";
            document.getElementById('statusMessage').classList.replace('text-slate-700', 'text-pink-600');
            targetAnchors = [];
            goldenZoneMarkers.forEach(m => m.setMap(null));
            goldenZoneMarkers = [];

            // 선택된 상권 테두리 범위를 기준으로 검색
            let bounds = new kakao.maps.LatLngBounds();
            polygonObj.getPath().forEach(coord => bounds.extend(coord));
            
            let anchorKeywords = ['올리브영', '다이소'];
            let searchesDone = 0;

            anchorKeywords.forEach(kw => {
                ps.keywordSearch(kw, function(data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(p => targetAnchors.push({ type: kw, data: p }));
                    }
                    searchesDone++;
                    if(searchesDone === anchorKeywords.length) calculateTop3GoldenZones();
                }, { bounds: bounds, size: 15 });
            });
        }

        function calculateTop3GoldenZones() {
            let olives = targetAnchors.filter(a => a.type === '올리브영');
            let daisos = targetAnchors.filter(a => a.type === '다이소');
            document.getElementById('anchor_count').innerText = olives.length + daisos.length;

            if(olives.length === 0 || daisos.length === 0) {
                document.getElementById('statusMessage').innerText = "✅ 스캔 완료 (올영+다이소 동시 상권 아님)";
                document.getElementById('statusMessage').classList.replace('text-pink-600', 'text-slate-700');
                return;
            }

            let allPairs = [];
            olives.forEach(oly => {
                daisos.forEach(dai => {
                    let dist = getDistanceMeters(oly.data.y, oly.data.x, dai.data.y, dai.data.x);
                    if(dist <= 300) { 
                        let cy = (parseFloat(oly.data.y) + parseFloat(dai.data.y))/2;
                        let cx = (parseFloat(oly.data.x) + parseFloat(dai.data.x))/2;
                        allPairs.push({ dist: dist, y: cy, x: cx });
                    }
                });
            });

            allPairs.sort((a, b) => a.dist - b.dist);

            let top3 = [];
            for(let i=0; i<allPairs.length; i++) {
                let candidate = allPairs[i];
                let isTooClose = false;
                for(let j=0; j<top3.length; j++) {
                    if(getDistanceMeters(candidate.y, candidate.x, top3[j].y, top3[j].x) < 50) isTooClose = true;
                }
                if(!isTooClose) top3.push(candidate);
                if(top3.length >= 3) break;
            }

            if (top3.length > 0) {
                document.getElementById('statusMessage').innerText = `👑 선택한 상권 내 1~${top3.length}순위 입지 발굴 완료!`;
                
                top3.forEach((zone, index) => {
                    let markerClass, labelText;
                    if(index === 0) { markerClass = 'rank-1-marker'; labelText = '👑 1순위 (최강입지)'; }
                    else if (index === 1) { markerClass = 'rank-2-marker'; labelText = '🥈 2순위 대안'; }
                    else { markerClass = 'rank-3-marker'; labelText = '🥉 3순위 대안'; }

                    let content = `<div class="${markerClass}">${labelText}</div>`;
                    let overlay = new kakao.maps.CustomOverlay({
                        position: new kakao.maps.LatLng(zone.y, zone.x), content: content, xAnchor: 0.5, yAnchor: 1.5
                    });
                    overlay.setMap(map);
                    goldenZoneMarkers.push(overlay);
                });
            }
            drawRadarChart(document.getElementById('comp_count').innerText, olives.length + daisos.length);
        }

        function refreshMarkers() {
            let bounds = map.getBounds();
            let f = { 'lensme': document.getElementById('f_lensme').checked, 'olens': document.getElementById('f_olens').checked, 'hapa': document.getElementById('f_hapa').checked, 'winc': document.getElementById('f_winc').checked, 'olive_shop': document.getElementById('f_olive_shop').checked, 'other': document.getElementById('f_other').checked };
            let v_comp = 0; 
            placeCache.forEach((item) => {
                let inBounds = bounds.contain(item.pos);
                let show = inBounds && f[item.brand];
                item.marker.setMap(show ? map : null);
                if(show && ['lensme','olens','hapa','winc','lenstown'].includes(item.brand)) v_comp++;
            });
            document.getElementById('comp_count').innerText = v_comp;
            drawRadarChart(v_comp, document.getElementById('anchor_count').innerText);
        }

        function updateStoreNames() {
            currentStoreName = document.getElementById('currentStoreInput').value || "현재 매장";
            targetLocationName = document.getElementById('targetLocationInput').value || "선택 상권";
            let targets = document.getElementsByClassName('targetLocationName');
            for(let i=0; i<targets.length; i++) targets[i].innerText = targetLocationName;
            let currents = document.getElementsByClassName('currentStoreName');
            for(let i=0; i<currents.length; i++) currents[i].innerText = currentStoreName;
        }

        function switchTab(tabId) {
            document.getElementById('tab-map').classList.add('hidden'); document.getElementById('tab-radar').classList.add('hidden');
            document.getElementById('btn-map').classList.remove('active'); document.getElementById('btn-radar').classList.remove('active');
            document.getElementById('tab-' + tabId).classList.remove('hidden'); document.getElementById('btn-' + tabId).classList.add('active');
            if(tabId === 'map') { map.relayout(); map.setCenter(map.getCenter()); }
            else if (tabId === 'radar') Plotly.Plots.resize(document.getElementById('radarChart')); 
        }

        function drawRadarChart(compCount = 0, anchorScoreRaw = 0) {
            let compScore = Math.max(10, 100 - (compCount * 8)); 
            let anchorScore = Math.min(100, 40 + (anchorScoreRaw * 15));
            let data = [
                { type: 'scatterpolar', r: [60, 55, 80, 70, 50, 60], theta: ['1020 유동인구', '타겟 밀집도', '경쟁 강도', '임대료 가성비', '상권 활력도', '1020 유동인구'], fill: 'toself', name: document.getElementById('currentStoreInput').value, line: {color: 'gray'}, fillcolor: 'rgba(128,128,128,0.4)' },
                { type: 'scatterpolar', r: [anchorScore, anchorScore-5, compScore, 65, anchorScore+5, anchorScore], theta: ['1020 유동인구', '타겟 밀집도', '경쟁 강도', '임대료 가성비', '상권 활력도', '1020 유동인구'], fill: 'toself', name: document.getElementById('targetLocationInput').value, line: {color: '#ec4899'}, fillcolor: 'rgba(236,72,153,0.4)' }
            ];
            let layout = { polar: { radialaxis: {visible: true, range: [0, 100]} }, showlegend: true, legend: {orientation: "h", y: -0.2}, margin: {t:30, b:30} };
            Plotly.newPlot('radarChart', data, layout, {responsive: true, displayModeBar: false});
        }
        
        renderDrillDown(1);
    </script>
