<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌즈미 상권 분석 대시보드</title>
    <!-- 폰트 및 디자인(Tailwind CSS) 불러오기 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen">

    <!-- 1. 좌측 사이드바 (검색 및 메뉴) -->
    <div class="w-full md:w-1/4 bg-white border-r border-gray-200 p-6 flex flex-col shadow-lg z-10">
        <h1 class="text-2xl font-extrabold text-slate-800 border-b-4 border-indigo-500 pb-3 mb-6">
            🗺️ 렌즈미 상권 분석기
        </h1>
        
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2">🔍 상권 위치 검색</label>
            <input type="text" id="searchInput" placeholder="예: 강남역, 서면 올리브영" 
                   class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-3"
                   onkeypress="if(event.keyCode==13) searchLocation()">
            <button onclick="searchLocation()" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                🚀 지도로 이동하기
            </button>
        </div>

        <div class="mt-4 bg-slate-50 p-4 rounded-lg border border-slate-200">
            <p class="text-xs text-slate-500 font-bold mb-1">현재 분석 대상 상권</p>
            <p id="currentLocationText" class="text-lg font-extrabold text-indigo-600">천안 신불당 상권</p>
        </div>
        
        <p id="statusMessage" class="mt-4 text-sm text-red-500 font-bold hidden"></p>
    </div>

    <!-- 2. 우측 메인 화면 (카카오맵) -->
    <div class="w-full md:w-3/4 h-full relative">
        <div id="map" class="w-full h-full"></div>
    </div>

    <!-- 3. 카카오맵 JS API (services 라이브러리 포함) -->
    <!-- 사장님의 JavaScript 키가 들어갔습니다! -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c045609510f8b75252389123f086be48&libraries=services"></script>
    
    <!-- 4. 지도 및 검색 동작 스크립트 -->
    <script>
        // 초기 설정 (천안)
        let mapContainer = document.getElementById('map'); 
        let defaultLat = 36.81510;
        let defaultLon = 127.11390;
        
        let mapOption = {
            center: new kakao.maps.LatLng(defaultLat, defaultLon),
            level: 4 // 확대 레벨
        };  
        
        // 지도 생성
        let map = new kakao.maps.Map(mapContainer, mapOption); 
        // 장소 검색 객체 생성 (카카오 검색 API 내장 기능)
        let ps = new kakao.maps.services.Places(); 
        
        let centerMarker = null;
        let circle = null;
        let compMarkers = []; // 주변 상가 마커들

        // 화면 띄울 때 초기 지도 세팅
        drawMapElements(defaultLat, defaultLon, "천안 신불당 상권");

        // 📍 검색 버튼 눌렀을 때 실행되는 함수
        function searchLocation() {
            let keyword = document.getElementById('searchInput').value;
            let statusMsg = document.getElementById('statusMessage');
            
            if (!keyword.trim()) {
                alert('검색어를 입력해주세요!');
                return;
            }

            // 카카오 장소 검색 실행
            ps.keywordSearch(keyword, function(data, status, pagination) {
                if (status === kakao.maps.services.Status.OK) {
                    statusMsg.classList.add('hidden');
                    let lat = data[0].y;
                    let lon = data[0].x;
                    let placeName = data[0].place_name;
                    
                    // 텍스트 업데이트
                    document.getElementById('currentLocationText').innerText = placeName;
                    
                    // 지도 이동 및 핀 다시 그리기
                    drawMapElements(lat, lon, placeName);
                    
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    statusMsg.innerText = "🚨 검색 결과가 존재하지 않습니다.";
                    statusMsg.classList.remove('hidden');
                } else {
                    statusMsg.innerText = "🚨 카카오 검색 서버 에러가 발생했습니다.";
                    statusMsg.classList.remove('hidden');
                }
            });
        }

        // 🗺️ 지도 위에 핀, 원, 주변 상가 그리는 함수
        function drawMapElements(lat, lon, placeName) {
            let moveLatLon = new kakao.maps.LatLng(lat, lon);
            
            // 1. 지도 중심 이동
            map.panTo(moveLatLon);

            // 2. 기존 마커/원 초기화
            if(centerMarker) centerMarker.setMap(null);
            if(circle) circle.setMap(null);
            compMarkers.forEach(m => m.setMap(null));
            compMarkers = [];

            // 3. 중심 마커 생성
            centerMarker = new kakao.maps.Marker({
                map: map,
                position: moveLatLon
            });

            // 4. 반경 500m 원 생성
            circle = new kakao.maps.Circle({
                center : moveLatLon,
                radius: 500, 
                strokeWeight: 2,
                strokeColor: '#4f46e5',
                strokeOpacity: 0.8,
                strokeStyle: 'solid',
                fillColor: '#4f46e5',
                fillOpacity: 0.15
            });
            circle.setMap(map);

            // 5. 주변 안경원 불러오기 (소상공인 API 연동)
            fetchCompetitors(lat, lon);
        }

        // 🏪 소상공인 API 호출 함수
        function fetchCompetitors(lat, lon) {
            // 사장님의 소상공인 API 키
            let apiKey = "aXN6wwYUtb8cmsw%2FKilpDWQn1wUuT6U1igFdsRMJNBT8%2ByFZY6dQe95h9rrcobd4%2Fz7JQG0e14PuzcIZNd%2BcbQ%3D%3D";
            let url = `https://apis.data.go.kr/B553077/api/open/sdam/bizesInfoInRadius?ServiceKey=${apiKey}&type=json&cy=${lat}&cx=${lon}&radius=500&numOfRows=100`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if(data && data.body && data.body.items) {
                        data.body.items.forEach(item => {
                            let name = item.bizesNm;
                            // 안경, 렌즈 관련 필터링
                            if(name.includes('안경') || name.includes('렌즈') || name.includes('다비치') || name.includes('오렌즈') || name.includes('글라스')) {
                                
                                let compMarker = new kakao.maps.Marker({
                                    map: map,
                                    position: new kakao.maps.LatLng(item.lat, item.lon),
                                    title: name
                                });

                                // 마우스 올렸을 때 말풍선
                                let infowindow = new kakao.maps.InfoWindow({
                                    content: `<div style="padding:5px;font-size:12px;font-weight:bold;">${name}</div>`
                                });

                                kakao.maps.event.addListener(compMarker, 'mouseover', function() {
                                    infowindow.open(map, compMarker);
                                });
                                kakao.maps.event.addListener(compMarker, 'mouseout', function() {
                                    infowindow.close();
                                });

                                compMarkers.push(compMarker);
                            }
                        });
                    }
                })
                .catch(error => console.log("상가 정보 로딩 실패:", error));
        }
    </script>
</body>
</html>
