<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌즈미 상권 분석 대시보드 (동선 추적 골든존 엔진)</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 800; }
        .tab-btn { color: #64748b; font-weight: 600; border-bottom: 4px solid transparent; }
        
        input[type=checkbox] { width: 1.1rem; height: 1.1rem; cursor: pointer; }
        .chk-purple { accent-color: #9333ea; } .chk-orange { accent-color: #f97316; } 
        .chk-red { accent-color: #dc2626; } .chk-green { accent-color: #16a34a; } 
        .chk-yellow { accent-color: #eab308; } .chk-pink { accent-color: #f472b6; } 
        .chk-blue { accent-color: #3b82f6; } .chk-emerald { accent-color: #059669; }

        /* 골든존(1~3순위) 마커 스타일 */
        @keyframes pulse-gold { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(250, 204, 21, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); } }
        .rank-1-marker { animation: pulse-gold 2s infinite; background: linear-gradient(135deg, #fde047 0%, #eab308 100%); border: 3px solid #fff; border-radius: 30px; padding: 5px 14px; color: #713f12; font-size: 14px; font-weight: 900; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 100; white-space: nowrap;}
        .rank-2-marker { background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%); border: 2px solid #fff; border-radius: 20px; padding: 4px 11px; color: #1e293b; font-size: 12px; font-weight: 800; box-shadow: 0 3px 6px rgba(0,0,0,0.25); z-index: 90; white-space: nowrap;}
        .rank-3-marker { background: linear-gradient(135deg, #fed7aa 0%, #ea580c 100%); border: 2px solid #fff; border-radius: 20px; padding: 4px 11px; color: #fff; font-size: 12px; font-weight: 800; box-shadow: 0 3px 6px rgba(0,0,0,0.25); z-index: 80; white-space: nowrap;}
        
        /* 타겟(검색) 마커 물결 애니메이션 */
        @keyframes pulse-target { 0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); } }
        .target-marker { width: 24px; height: 24px; background-color: #ec4899; border: 3px solid #fff; border-radius: 50%; animation: pulse-target 1.5s infinite; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen text-slate-800">

    <div class="w-full md:w-1/4 bg-white border-r border-gray-200 p-6 flex flex-col shadow-lg z-20 overflow-y-auto">
        <h1 class="text-xl font-extrabold text-slate-800 border-b-4 border-indigo-500 pb-3 mb-5 flex justify-between items-center">
            <span>🗺️ 상권 동선 분석기</span>
            <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full font-bold">LIVE</span>
        </h1>
        
        <div class="mb-5 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <label class="block text-sm font-extrabold text-indigo-700 mb-2">🎯 상권 및 매장 검색</label>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="예: 렌즈미 두정점, 강남역" class="w-full bg-white border border-indigo-300 px-3 py-2 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeypress="if(event.key==='Enter') searchLocation()">
                <button onclick="searchLocation()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-sm whitespace-nowrap">검색</button>
            </div>
        </div>

        <div class="mb-2 bg-white p-4 rounded-lg border border-slate-200 shadow-sm space-y-3">
            <div>
                <p class="text-xs text-slate-400 font-bold mb-1">현재 기준 매장명</p>
                <input type="text" id="currentStoreInput" placeholder="비교할 기준 매장을 입력하세요" class="w-full bg-slate-50 border border-gray-300 px-3 py-1.5 rounded-md font-semibold text-sm" oninput="updateStoreNames()">
            </div>
            <div>
                <p class="text-xs text-slate-400 font-bold mb-1">분석 대상 상권 (목적지)</p>
                <input type="text" id="targetLocationInput" value="강남역" class="w-full bg-slate-50 border border-indigo-300 px-3 py-1.5 rounded-md font-extrabold text-indigo-600 text-base" readonly>
            </div>
            
            <div class="bg-indigo-50/80 p-3 rounded-lg border border-indigo-100 space-y-1.5 mt-2">
                <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                    <span>⚔️ 경쟁 안경/렌즈샵:</span>
                    <span id="comp_count" class="text-sm font-black text-pink-600">0개</span>
                </div>
                <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                    <span>📸 핵심 앵커 (올영/다이소):</span>
                    <span id="anchor_count" class="text-sm font-black text-emerald-600">0개</span>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full md:w-3/4 flex flex-col bg-slate-50 overflow-hidden">
        <div class="flex bg-white px-6 pt-3 border-b border-gray-200 overflow-x-auto whitespace-nowrap z-10">
            <button onclick="switchTab('map')" id="btn-map" class="tab-btn active px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📍 동선 골든존 지도</button>
            <button onclick="switchTab('radar')" id="btn-radar" class="tab-btn px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📊 입지 매력도</button>
        </div>

        <div id="tab-map" class="flex-grow w-full h-full relative">
            <div id="statusMessage" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 bg-white/95 backdrop-blur-sm px-6 py-2 rounded-full shadow-md text-sm font-bold text-slate-700 border border-slate-200 text-center transition-all">
                🎯 검색 및 지도를 이동하면 상권 스캔이 자동으로 시작됩니다.
            </div>

            <div class="absolute top-16 left-4 z-10 bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-slate-200 w-60 max-h-[80vh] overflow-y-auto">
                <p class="text-xs text-slate-400 font-bold mb-1 text-right">실시간 스캔 DB</p>
                <p class="text-xs font-extrabold text-slate-800 mb-2.5 border-b pb-1">🎯 렌즈 전문 브랜드</p>
                <div class="space-y-2 mb-3">
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_lensme" onchange="triggerScan()" class="chk-purple" checked><span class="text-xs font-bold text-purple-700">🟣 렌즈미</span></div><span id="c_lensme" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_olens" onchange="triggerScan()" class="chk-orange" checked><span class="text-xs font-bold text-orange-600">🟠 오렌즈</span></div><span id="c_olens" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_hapa" onchange="triggerScan()" class="chk-pink" checked><span class="text-xs font-bold text-pink-500">🌸 하파크리스틴</span></div><span id="c_hapa" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_winc" onchange="triggerScan()" class="chk-blue" checked><span class="text-xs font-bold text-blue-600">🔵 윙크렌즈</span></div><span id="c_winc" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_withlens" onchange="triggerScan()" class="chk-emerald" checked><span class="text-xs font-bold text-emerald-600">🟢 위드렌즈</span></div><span id="c_withlens" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_lensvery" onchange="triggerScan()" class="chk-yellow" checked><span class="text-xs font-bold text-yellow-600">🟡 렌즈베리</span></div><span id="c_lensvery" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_lenstown" onchange="triggerScan()" class="chk-red" checked><span class="text-xs font-bold text-red-600">🔴 렌즈타운</span></div><span id="c_lenstown" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                </div>
                <p class="text-xs font-extrabold text-slate-800 mb-2 border-b pb-1 mt-3">🌿 앵커 집객시설</p>
                <div class="space-y-2">
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_olive_shop" checked onchange="triggerScan()" class="chk-green"><span class="text-xs font-bold text-teal-700">🌿 올영 입점(렌즈)</span></div><span id="c_olive_shop" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_olive" checked onchange="triggerScan()" class="chk-green"><span class="text-xs font-bold text-green-600">🟩 올리브영</span></div><span id="c_olive" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_daiso" checked onchange="triggerScan()" class="chk-red"><span class="text-xs font-bold text-rose-600">🟥 다이소</span></div><span id="c_daiso" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                    <label class="flex justify-between items-center"><div class="flex items-center space-x-2"><input type="checkbox" id="f_davich" checked onchange="triggerScan()" class="chk-blue"><span class="text-xs font-bold text-blue-700">🟦 다비치안경</span></div><span id="c_davich" class="text-[11px] font-extrabold text-slate-500">0개</span></label>
                </div>
            </div>

            <div id="map" class="w-full h-full"></div>
        </div>

        <div id="tab-radar" class="hidden flex-grow w-full p-8 overflow-y-auto">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-base mb-2">🏪 <b>현재:</b> <span class="currentStoreName font-bold">미지정</span></p>
                    <p class="text-base mb-2">🚩 <b>후보:</b> <span class="targetLocationName text-pink-500 font-bold"></span></p>
                    <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 mt-4 space-y-2">
                        <p class="text-sm font-bold text-indigo-800">👑 동선/앵커 밀집 점수 환산</p>
                        <p class="text-sm text-slate-700">⚔️ 해당 구역 경쟁 매장: <span id="comp_count_radar" class="text-lg font-extrabold text-pink-600 ml-1">0</span>개</p>
                        <p class="text-sm text-slate-700">📸 동선 상 핵심 앵커: <span id="anchor_count_radar" class="text-lg font-extrabold text-green-600 ml-1">0</span>개</p>
                    </div>
                </div>
                <div class="w-full md:w-2/3 bg-white p-4 rounded-xl shadow-sm border border-slate-200" style="height: 500px;"><div id="radarChart" class="w-full h-full"></div></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c045609510f8b75252389123f086be48&libraries=services"></script>

    <script>
        let mapContainer = document.getElementById('map'); 
        let currentCenter = new kakao.maps.LatLng(37.498095, 127.027610); // 기본 강남역
        let map = new kakao.maps.Map(mapContainer, { center: currentCenter, level: 4 }); 
        let ps = new kakao.maps.services.Places(); 
        
        let mapMarkers = [];
        let goldenZoneMarkers = [];
        let targetMarkerOverlay = null; // 검색한 타겟 마커
        let placeCache = new Map();
        let searchTimeout = null;

        const BRAND_CONFIG = {
            f_lensme: { kw: '렌즈미', hex: '%239333ea', icon: '🟣' },
            f_olens: { kw: '오렌즈', hex: '%23f97316', icon: '🟠' },
            f_hapa: { kw: '하파크리스틴', hex: '%23f472b6', icon: '🌸' },
            f_winc: { kw: '윙크 렌즈', hex: '%233b82f6', icon: '🔵' },
            f_withlens: { kw: '위드렌즈', hex: '%23059669', icon: '🟢' },
            f_lensvery: { kw: '렌즈베리', hex: '%23eab308', icon: '🟡' },
            f_lenstown: { kw: '렌즈타운', hex: '%23dc2626', icon: '🔴' },
            f_olive_shop: { kw: '올리브영 안경', hex: '%230f766e', icon: '🌿' },
            f_olive: { kw: '올리브영', hex: '%2316a34a', icon: '🟩' },
            f_daiso: { kw: '다이소', hex: '%23e11d48', icon: '🟥' },
            f_davich: { kw: '다비치안경', hex: '%231d4ed8', icon: '🟦' }
        };

        // 타겟 위치 검색
        function searchLocation() {
            let q = document.getElementById('searchInput').value.trim();
            if(!q) return;

            ps.keywordSearch(q, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    let place = data[0];
                    currentCenter = new kakao.maps.LatLng(place.y, place.x);
                    document.getElementById('targetLocationInput').value = place.place_name;
                    updateStoreNames();

                    map.setCenter(currentCenter);
                    map.setLevel(3);

                    // 타겟 전용 강조 애니메이션 마커 생성
                    if(targetMarkerOverlay) targetMarkerOverlay.setMap(null);
                    let content = `<div class="target-marker" title="${place.place_name}"></div>`;
                    targetMarkerOverlay = new kakao.maps.CustomOverlay({
                        position: currentCenter,
                        content: content,
                        xAnchor: 0.5, yAnchor: 0.5
                    });
                    targetMarkerOverlay.setMap(map);

                    // 지도 이동 시 자동으로 주변 스캔 Trigger 됨
                } else {
                    alert("검색 결과가 없습니다. 지명을 다시 확인해 주세요.");
                }
            });
        }

        // 지도 이동 시 스캔 발동
        kakao.maps.event.addListener(map, 'idle', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(runScan, 500); 
        });

        function triggerScan() {
            runScan();
        }

        function clearOverlays() {
            mapMarkers.forEach(m => m.setMap(null));
            mapMarkers = [];
            goldenZoneMarkers.forEach(m => m.setMap(null));
            goldenZoneMarkers = [];
            placeCache.clear();
        }

        // 실시간 브랜드 및 앵커 병합 스캔 (5m 중복제거 방어)
        function runScan() {
            document.getElementById('statusMessage').innerText = "🔎 지도 영역 내 유동인구 동선 및 브랜드 매장 스캔 중...";
            clearOverlays();

            let bounds = map.getBounds();
            let activeKeys = Object.keys(BRAND_CONFIG).filter(key => document.getElementById(key) && document.getElementById(key).checked);
            
            let totalCompStores = 0;
            let totalAnchors = 0;
            let anchorData = { olives: [], daisos: [], stations: [], olens: [] };
            
            // 모든 카운터 0 초기화
            Object.keys(BRAND_CONFIG).forEach(k => { document.getElementById('c_' + k.replace('f_','')).innerText = "0개"; });

            let searchPromises = activeKeys.map(key => new Promise(resolve => {
                ps.keywordSearch(BRAND_CONFIG[key].kw, function(data, status) {
                    let count = 0;
                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(place => {
                            if (createMarkerWithDeduplication(place, key)) {
                                count++;
                                if (['f_olive', 'f_daiso', 'f_davich'].includes(key)) totalAnchors++;
                                else totalCompStores++;

                                if(key === 'f_olive') anchorData.olives.push(place);
                                if(key === 'f_daiso') anchorData.daisos.push(place);
                                if(key === 'f_olens') anchorData.olens.push(place);
                            }
                        });
                    }
                    document.getElementById('c_' + key.replace('f_','')).innerText = count + "개";
                    resolve();
                }, { bounds: bounds, size: 15 });
            }));

            // 동선 분석을 위한 '지하철역' 별도 스캔
            searchPromises.push(new Promise(resolve => {
                ps.keywordSearch("지하철역", function(data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(p => anchorData.stations.push(p));
                    }
                    resolve();
                }, { bounds: bounds, size: 10 });
            }));

            Promise.all(searchPromises).then(() => {
                document.getElementById('comp_count').innerText = totalCompStores + '개';
                document.getElementById('anchor_count').innerText = totalAnchors + '개';
                document.getElementById('comp_count_radar').innerText = totalCompStores + '개';
                document.getElementById('anchor_count_radar').innerText = totalAnchors + '개';

                calculatePathwayGoldenZones(anchorData);
                drawRadarChart(totalCompStores, totalAnchors);
            });
        }

        // 5m 내 유령 중복 마커 제거 및 그리기
        function createMarkerWithDeduplication(place, key) {
            let isDuplicate = false;
            placeCache.forEach((existingItem) => {
                if(existingItem.brand === key) {
                    let dist = getDistanceMeters(place.y, place.x, existingItem.rawData.y, existingItem.rawData.x);
                    if(dist < 5) isDuplicate = true;
                }
            });
            if(isDuplicate) return false;

            let cfg = BRAND_CONFIG[key];
            let svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="${cfg.hex}" stroke="white" stroke-width="2.5"/></svg>`;
            let markerImage = new kakao.maps.MarkerImage('data:image/svg+xml;utf-8,' + svgString, new kakao.maps.Size(24, 24), { offset: new kakao.maps.Point(12, 12) });
            
            let marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(place.y, place.x), image: markerImage, title: place.place_name });
            let infowindow = new kakao.maps.InfoWindow({ content: `<div style="padding:5px;font-size:12px;font-weight:bold;">${cfg.icon} ${place.place_name}</div>` });
            
            kakao.maps.event.addListener(marker, 'mouseover', function() { infowindow.open(map, marker); });
            kakao.maps.event.addListener(marker, 'mouseout', function() { infowindow.close(); });
            
            marker.setMap(map);
            mapMarkers.push(marker);
            placeCache.set(place.id, { brand: key, rawData: place });
            
            return true;
        }

        // 역 ↔ 올영/다이소 메인 동선 기반 사거리 골든존 발굴 알고리즘
        function calculatePathwayGoldenZones(anchorData) {
            let candidates = [...anchorData.olives, ...anchorData.daisos, ...anchorData.olens];
            let stations = anchorData.stations;

            if(candidates.length === 0) {
                document.getElementById('statusMessage').innerText = "✅ 해당 구역 스캔 완료 (앵커/경쟁사 데이터 부족)";
                return;
            }

            // 각 앵커 위치에 대해 동선 가중치 계산
            let scoredPoints = [];
            candidates.forEach(cand => {
                let score = 0;
                
                // 1. 역과의 거리 점수 (역에서 가까운 길목일수록 가점)
                let minStationDist = 9999;
                stations.forEach(st => {
                    let d = getDistanceMeters(cand.y, cand.x, st.y, st.x);
                    if(d < minStationDist) minStationDist = d;
                });
                if(minStationDist <= 400) score += (400 - minStationDist) / 10; // 역 반경 400m 내 가점

                // 2. 다른 앵커(올영/다이소) 밀집도 점수 (교차로나 상권 중심일 확률 높음)
                candidates.forEach(other => {
                    if(cand.id !== other.id) {
                        let d = getDistanceMeters(cand.y, cand.x, other.y, other.x);
                        if(d <= 80) score += 15; // 80m 내에 앵커가 겹치면 큰 가점
                    }
                });

                scoredPoints.push({ x: cand.x, y: cand.y, score: score, name: cand.place_name });
            });

            // 점수순 정렬 후 거리가 60m 이상 떨어진 독립된 구역 1~3순위 추출
            scoredPoints.sort((a,b) => b.score - a.score);
            let top3 = [];
            for(let p of scoredPoints) {
                if(!top3.some(t => getDistanceMeters(p.y, p.x, t.y, t.x) < 60)) {
                    top3.push(p);
                }
                if(top3.length >= 3) break;
            }

            if(top3.length > 0 && top3[0].score > 10) {
                top3.forEach((z, idx) => {
                    let mClass = idx===0 ? 'rank-1-marker' : (idx===1 ? 'rank-2-marker' : 'rank-3-marker');
                    let label = idx===0 ? '👑 1순위 상권목' : (idx===1 ? '🥈 2순위 길목' : '🥉 3순위 길목');
                    let overlay = new kakao.maps.CustomOverlay({
                        position: new kakao.maps.LatLng(z.y, z.x),
                        content: `<div class="${mClass}">${label}</div>`,
                        xAnchor: 0.5, yAnchor: 1.5
                    });
                    overlay.setMap(map);
                    goldenZoneMarkers.push(overlay);
                });
                document.getElementById('statusMessage').innerText = `👑 역 ↔ 앵커 메인 동선 분석 완료! (1~${top3.length}순위 사거리 표시)`;
            } else {
                document.getElementById('statusMessage').innerText = "✅ 해당 구역 스캔 완료 (명확한 동선 교차점 없음)";
            }
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            let R = 6371000; 
            let dLat = (lat2-lat1)*(Math.PI/180), dLon = (lon2-lon1)*(Math.PI/180);
            let a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180))*Math.cos(lat2*(Math.PI/180))*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateStoreNames() {
            let cur = document.getElementById('currentStoreInput').value || "미지정";
            let tar = document.getElementById('targetLocationInput').value || "선택 상권";
            document.querySelectorAll('.currentStoreName').forEach(e => e.innerText = cur);
            document.querySelectorAll('.targetLocationName').forEach(e => e.innerText = tar);
        }

        function switchTab(tabId) {
            document.getElementById('tab-map').classList.add('hidden'); document.getElementById('tab-radar').classList.add('hidden');
            document.getElementById('btn-map').classList.remove('active'); document.getElementById('btn-radar').classList.remove('active');
            document.getElementById('tab-' + tabId).classList.remove('hidden'); document.getElementById('btn-' + tabId).classList.add('active');
            if(tabId === 'map') { map.relayout(); map.setCenter(map.getCenter()); }
            else if (tabId === 'radar') Plotly.Plots.resize(document.getElementById('radarChart')); 
        }

        function drawRadarChart(compCount=0, anchorScoreRaw=0) {
            let compScore = Math.max(10, 100 - (compCount * 8)); 
            let anchorScore = Math.min(100, 30 + (anchorScoreRaw * 12));
            let data = [
                { type: 'scatterpolar', r: [60, 55, 80, 70, 50, 60], theta: ['1030 유동인구', '타겟밀집', '경쟁강도', '임대료가성비', '상권활력', '1030 유동인구'], fill: 'toself', name: document.getElementById('currentStoreInput').value || "미지정", line: {color: 'gray'}, fillcolor: 'rgba(128,128,128,0.4)' },
                { type: 'scatterpolar', r: [anchorScore+5, anchorScore, compScore, 65, anchorScore+5, anchorScore+5], theta: ['1030 유동인구', '타겟밀집', '경쟁강도', '임대료가성비', '상권활력', '1030 유동인구'], fill: 'toself', name: document.getElementById('targetLocationInput').value, line: {color: '#ec4899'}, fillcolor: 'rgba(236,72,153,0.4)' }
            ];
            Plotly.newPlot('radarChart', data, { polar: { radialaxis: {visible: true, range: [0, 100]} }, margin: {t:30, b:30}, legend: {orientation: "h", y: -0.2} }, {responsive: true, displayModeBar: false});
        }

        // 초기 강남역 스캔 실행
        runScan();
    </script>
</body>
