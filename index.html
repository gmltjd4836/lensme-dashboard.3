<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>렌즈미 / 오렌즈 상권 분석 대시보드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 카카오맵 API (appkey 부분에 발급받은 자바스크립트 키 입력) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JAVASCRIPT_KEY&libraries=services"></script>
  <style>
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row h-screen overflow-hidden">

  <!-- 사이드바 / 제어판 -->
  <div class="w-full md:w-96 bg-white border-r border-gray-200 flex flex-col h-full z-10 shadow-lg">
    <!-- 헤더 -->
    <div class="p-4 border-b border-gray-200 bg-indigo-900 text-white">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>👁️</span> 렌즈 매장 현황 분석
      </h1>
      <p class="text-xs text-indigo-200 mt-1">카카오맵 기반 실시간 위치 & 수량 파악</p>
    </div>

    <!-- 검색 영역 -->
    <div class="p-4 border-b border-gray-200 space-y-3">
      <label class="block text-sm font-medium text-gray-700">지역/역명 검색</label>
      <div class="flex gap-2">
        <input type="text" id="keyword" placeholder="예: 부평역, 강남역, 둔산동" 
               class="flex-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
               onkeydown="if(event.key === 'Enter') searchRegion()">
        <button onclick="searchRegion()" 
                class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition">
          검색
        </button>
      </div>
      <button onclick="searchCurrentBounds()" 
              class="w-full py-2 bg-gray-800 text-white rounded-lg text-sm font-semibold hover:bg-gray-900 transition flex items-center justify-center gap-1">
        <span>🔄</span> 현재 지도 화면 재검색
      </button>
    </div>

    <!-- 집계 요약 대시보드 -->
    <div class="p-4 bg-gray-50 border-b border-gray-200 grid grid-cols-2 gap-3">
      <div class="p-3 bg-purple-50 border border-purple-200 rounded-lg text-center">
        <div class="text-xs font-bold text-purple-700 mb-1">렌즈미</div>
        <div class="text-2xl font-black text-purple-900" id="count-lensme">0<span class="text-sm font-normal">개</span></div>
      </div>
      <div class="p-3 bg-orange-50 border border-orange-200 rounded-lg text-center">
        <div class="text-xs font-bold text-orange-700 mb-1">오렌즈</div>
        <div class="text-2xl font-black text-orange-900" id="count-olens">0<span class="text-sm font-normal">개</span></div>
      </div>
    </div>

    <!-- 매장 리스트 -->
    <div class="flex-1 overflow-y-auto p-4 space-y-2" id="store-list">
      <div class="text-center text-gray-400 py-10 text-sm">지역을 검색하거나 지도를 이동한 뒤<br>재검색 버튼을 눌러주세요.</div>
    </div>
  </div>

  <!-- 카카오맵 영역 -->
  <div class="flex-1 relative">
    <div id="map"></div>
  </div>

  <script>
    let map;
    let ps;
    let markers = [];

    // 초기화
    window.onload = function() {
      const container = document.getElementById('map');
      const options = {
        center: new kakao.maps.LatLng(37.4894, 126.7225), // 기본 위치 (부평역 부근)
        level: 5
      };
      map = new kakao.maps.Map(container, options);
      ps = new kakao.maps.services.Places();

      // 지도 이동 완료 시 자동 재검색 (선택 사항)
      kakao.maps.event.addListener(map, 'idle', searchCurrentBounds);
      
      searchCurrentBounds();
    };

    // 키워드로 지역 중심 이동 후 매장 검색
    function searchRegion() {
      const query = document.getElementById('keyword').value.trim();
      if (!query) return;

      ps.keywordSearch(query, (data, status) => {
        if (status === kakao.maps.services.Status.OK) {
          const moveLatLon = new kakao.maps.LatLng(data[0].y, data[0].x);
          map.setCenter(moveLatLon);
          searchCurrentBounds();
        } else {
          alert('검색 결과를 찾을 수 없습니다.');
        }
      });
    }

    // 현재 지도 영역(Bounds) 기준으로 렌즈미 & 오렌즈 검색
    function searchCurrentBounds() {
      clearMarkers();
      
      const bounds = map.getBounds();
      let stores = { lensme: [], olens: [] };

      // 1. 렌즈미 검색
      ps.keywordSearch('렌즈미', (data, status) => {
        if (status === kakao.maps.services.Status.OK) {
          stores.lensme = data;
        }
        // 2. 오렌즈 검색
        ps.keywordSearch('오렌즈', (data2, status2) => {
          if (status2 === kakao.maps.services.Status.OK) {
            stores.olens = data2;
          }
          renderResults(stores);
        }, { bounds: bounds });
      }, { bounds: bounds });
    }

    // 마커 및 리스트 출력
    function renderResults(stores) {
      document.getElementById('count-lensme').innerText = stores.lensme.length;
      document.getElementById('count-olens').innerText = stores.olens.length;

      const listContainer = document.getElementById('store-list');
      listContainer.innerHTML = '';

      const allStores = [
        ...stores.lensme.map(s => ({ ...s, brand: '렌즈미', color: '#7e22ce', bg: 'bg-purple-100', text: 'text-purple-800' })),
        ...stores.olens.map(s => ({ ...s, brand: '오렌즈', color: '#c2410c', bg: 'bg-orange-100', text: 'text-orange-800' }))
      ];

      if (allStores.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">현재 화면 내에 탐지된 매장이 없습니다.</div>';
        return;
      }

      allStores.forEach(store => {
        // 마커 생성
        const markerPosition = new kakao.maps.LatLng(store.y, store.x);
        
        // Custom Overlay 마커 (브랜드별 색상 구분)
        const content = document.createElement('div');
        content.className = `px-2 py-1 rounded-full text-xs font-bold text-white shadow-md cursor-pointer border border-white`;
        content.style.backgroundColor = store.color;
        content.innerText = `${store.brand}`;

        const customOverlay = new kakao.maps.CustomOverlay({
          position: markerPosition,
          content: content,
          yAnchor: 1
        });

        customOverlay.setMap(map);
        markers.push(customOverlay);

        // 사이드바 리스트 아이템 추가
        const item = document.createElement('div');
        item.className = 'p-3 bg-white border border-gray-200 rounded-lg hover:border-indigo-400 cursor-pointer transition shadow-sm';
        item.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-sm text-gray-800">${store.place_name}</span>
            <span class="text-xs px-2 py-0.5 rounded font-semibold ${store.bg} ${store.text}">${store.brand}</span>
          </div>
          <div class="text-xs text-gray-500">${store.road_address_name || store.address_name}</div>
          <div class="text-xs text-gray-400 mt-1">${store.phone || '전화번호 정보 없음'}</div>
        `;

        item.onclick = () => {
          map.panTo(markerPosition);
        };

        listContainer.appendChild(item);
      });
    }

    // 기존 마커 삭제
    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }
  </script>
</body>
</html>
