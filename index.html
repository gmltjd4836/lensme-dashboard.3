<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌즈미 상권 분석 대시보드 (하이브리드 엔진 & 무게중심 코어)</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 800; }
        .tab-btn { color: #64748b; font-weight: 600; border-bottom: 4px solid transparent; }
        
        input[type=checkbox] { width: 1.1rem; height: 1.1rem; cursor: pointer; }
        .chk-purple { accent-color: #9333ea; } .chk-orange { accent-color: #f97316; } 
        .chk-red { accent-color: #dc2626; } .chk-green { accent-color: #16a34a; } 
        .chk-yellow { accent-color: #eab308; } .chk-pink { accent-color: #f472b6; } 
        .chk-blue { accent-color: #3b82f6; } .chk-emerald { accent-color: #059669; }

        /* A급 메인 코어 (무게중심 사거리) 소형 마커 */
        .core-marker-container { position: relative; cursor: pointer; }
        .core-dot { width: 18px; height: 18px; background-color: #ec4899; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 100; animation: pulse-core 1.5s infinite; }
        .core-label { position: absolute; top: -26px; left: -30px; background: rgba(255,255,255,0.95); border: 2px solid #ec4899; color: #ec4899; font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 6px; white-space: nowrap; box-shadow: 0 3px 6px rgba(236,72,153,0.3); pointer-events: none;}
        @keyframes pulse-core { 0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); } }
        
        /* 마우스 오버 말풍선(Tooltip) 스타일 */
        .store-tooltip { background: #ffffff; border: 2px solid #334155; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: #0f172a; box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap; transform: translateY(-10px); z-index: 200;}
        .store-tooltip::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: #334155 transparent transparent transparent; }

        /* 지도 위 둥둥 떠있는 상권 이름표 (클릭 가능) */
        .district-nametag { background: rgba(79, 70, 229, 0.95); border: 2px solid #fff; border-radius: 20px; padding: 6px 14px; color: #fff; font-size: 13px; font-weight: 800; box-shadow: 0 4px 8px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.2s ease; white-space: nowrap; z-index: 90; backdrop-filter: blur(4px); }
        .district-nametag:hover { background: #ec4899; transform: scale(1.05) translateY(-2px); box-shadow: 0 6px 12px rgba(236, 72, 153, 0.4); }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen text-slate-800">

    <div class="w-full md:w-1/4 bg-white border-r border-gray-200 p-6 flex flex-col shadow-lg z-20 overflow-y-auto">
        <h1 class="text-xl font-extrabold text-slate-800 border-b-4 border-indigo-500 pb-3 mb-4 flex justify-between items-center">
            <span>🗺️ 스마트 상권 분석기</span>
            <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full font-bold">무게중심 코어</span>
        </h1>
        
        <div class="mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <label class="block text-sm font-extrabold text-indigo-700 mb-2">🎯 상권 검색 및 클릭</label>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="예: 의정부역, 부평역" class="w-full bg-white border border-indigo-300 px-3 py-2 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeypress="if(event.key==='Enter') searchLocation()">
                <button onclick="searchLocation()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-sm whitespace-nowrap">검색</button>
            </div>
            <p class="text-xs text-slate-500 font-bold mt-2">💡 지도 위에 둥둥 뜬 <b class="text-indigo-600">상권 이름표</b>나 <b class="text-indigo-600">매장</b>을 클릭하면 즉시 메인 거리를 분석합니다.</p>
        </div>

        <div id="gradeBadge" class="mb-4 text-center py-3 rounded-xl bg-gray-100 border border-gray-200 text-gray-500 font-bold text-sm shadow-sm transition-all duration-300">
            분석 대상을 선택해 주세요.
        </div>

        <div class="mb-2 bg-white p-4 rounded-lg border border-slate-200 shadow-sm space-y-3">
            <div>
                <p class="text-xs text-slate-400 font-bold mb-1">현재 기준 매장명</p>
                <input type="text" id="currentStoreInput" placeholder="비교할 기준 매장" class="w-full bg-slate-50 border border-gray-300 px-3 py-1.5 rounded-md font-semibold text-sm" oninput="updateStoreNames()">
            </div>
            <div>
                <p class="text-xs text-slate-400 font-bold mb-1">분석 대상 상권</p>
                <input type="text" id="targetLocationInput" value="" class="w-full bg-slate-50 border border-indigo-300 px-3 py-1.5 rounded-md font-extrabold text-indigo-600 text-base" readonly>
            </div>
            
            <div class="bg-indigo-50/80 p-3 rounded-lg border border-indigo-100 space-y-1.5 mt-2">
                <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                    <span>⚔️ 상권 반경 내 경쟁 렌즈샵:</span>
                    <span id="comp_count" class="text-sm font-black text-pink-600">0개</span>
                </div>
                <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                    <span>📸 상권 반경 내 앵커(올/다):</span>
                    <span id="anchor_count" class="text-sm font-black text-emerald-600">0개</span>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full md:w-3/4 flex flex-col bg-slate-50 overflow-hidden">
        <div class="flex bg-white px-6 pt-3 border-b border-gray-200 overflow-x-auto whitespace-nowrap z-10">
            <button onclick="switchTab('map')" id="btn-map" class="tab-btn active px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📍 보행자 리얼 동선 지도</button>
            <button onclick="switchTab('radar')" id="btn-radar" class="tab-btn px-4 py-2 mr-4 text-base hover:text-indigo-500 transition">📊 입지 매력도</button>
        </div>

        <div id="tab-map" class="flex-grow w-full h-full relative">
            <div id="statusMessage" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 bg-white/95 backdrop-blur-sm px-6 py-2 rounded-full shadow-md text-sm font-bold text-slate-700 border border-slate-200 text-center transition-all">
                🎯 지도를 둘러보다가 상권 이름표를 클릭해 보세요!
            </div>

            <div class="absolute top-16 left-4 z-10 bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-slate-200 w-56 max-h-[80vh] overflow-y-auto hidden md:block">
                <p class="text-xs font-extrabold text-slate-800 mb-2.5 border-b pb-1">🎯 렌즈 전문 브랜드</p>
                <div class="space-y-2 mb-4">
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lensme" onchange="triggerScan()" class="chk-purple" checked><span class="text-[13px] font-bold text-purple-700">🟣 렌즈미 <span id="global_lensme" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olens" onchange="triggerScan()" class="chk-orange" checked><span class="text-[13px] font-bold text-orange-600">🟠 오렌즈 <span id="global_olens" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_hapa" onchange="triggerScan()" class="chk-pink" checked><span class="text-[13px] font-bold text-pink-500">🌸 하파크리스틴 <span id="global_hapa" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_winc" onchange="triggerScan()" class="chk-blue" checked><span class="text-[13px] font-bold text-blue-600">🔵 윙크렌즈 <span id="global_winc" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_withlens" onchange="triggerScan()" class="chk-emerald" checked><span class="text-[13px] font-bold text-emerald-600">🟢 위드렌즈 <span id="global_withlens" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lensvery" onchange="triggerScan()" class="chk-yellow" checked><span class="text-[13px] font-bold text-yellow-600">🟡 렌즈베리 <span id="global_lensvery" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_lenstown" onchange="triggerScan()" class="chk-red" checked><span class="text-[13px] font-bold text-red-600">🔴 렌즈타운 <span id="global_lenstown" class="text-slate-400 font-bold ml-1"></span></span></label>
                </div>
                <p class="text-xs font-extrabold text-slate-800 mb-2 border-b pb-1 mt-3">🌿 앵커 집객시설</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olive_shop" checked onchange="triggerScan()" class="chk-green"><span class="text-[13px] font-bold text-teal-700">🌿 올영(하파/윙크) <span id="global_olive_hapa" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_olive" checked onchange="triggerScan()" class="chk-green"><span class="text-[13px] font-bold text-green-600">🟩 올리브영 <span id="global_olive" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_daiso" checked onchange="triggerScan()" class="chk-red"><span class="text-[13px] font-bold text-rose-600">🟥 다이소 <span id="global_daiso" class="text-slate-400 font-bold ml-1"></span></span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="f_davich" checked onchange="triggerScan()" class="chk-blue"><span class="text-[13px] font-bold text-blue-700">🟦 다비치안경 <span id="global_davich" class="text-slate-400 font-bold ml-1"></span></span></label>
                </div>
            </div>

            <div id="map" class="w-full h-full"></div>
        </div>

        <div id="tab-radar" class="hidden flex-grow w-full p-8 overflow-y-auto">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-base mb-2">🏪 <b>현재:</b> <span class="currentStoreName font-bold">미지정</span></p>
                    <p class="text-base mb-2">🚩 <b>후보:</b> <span class="targetLocationName text-pink-500 font-bold"></span></p>
                </div>
                <div class="w-full md:w-2/3 bg-white p-4 rounded-xl shadow-sm border border-slate-200" style="height: 500px;"><div id="radarChart" class="w-full h-full"></div></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c045609510f8b75252389123f086be48&libraries=services"></script>

    <script>
        // 사장님의 진짜 TMAP 열쇠 유지
        const TMAP_APP_KEY = "mJJ00gscCg39Y6nR0LhUw2yzrIfr7arY65OwUZYk";

        let script = document.createElement('script');
        script.src = 'store_counts.js?v=' + new Date().getTime();
        script.onload = function() {
            if (typeof GLOBAL_COUNTS !== 'undefined') {
                const idMap = { 
                    'lensme': 'global_lensme', 'olens': 'global_olens', 'hapa': 'global_hapa',
                    'winc': 'global_winc', 'withlens': 'global_withlens', 'lensvery': 'global_lensvery', 'lenstown': 'global_lenstown',
                    'davich': 'global_davich', 'olive': 'global_olive', 'daiso': 'global_daiso', 'olive_hapa': 'global_olive_hapa' 
                };
                for(let key in idMap) {
                    let el = document.getElementById(idMap[key]);
                    if(el && GLOBAL_COUNTS[key] !== undefined) el.innerText = `(${GLOBAL_COUNTS[key]}개)`;
                }
            }
        };
        document.head.appendChild(script);

        let mapContainer = document.getElementById('map'); 
        let currentCenter = new kakao.maps.LatLng(37.498095, 127.027610); 
        let searchCenter = currentCenter; 
        let map = new kakao.maps.Map(mapContainer, { center: currentCenter, level: 3 }); 
        let ps = new kakao.maps.services.Places(); 
        
        let mapMarkers = [];
        let districtOverlays = []; // 상권 이름표 배열
        let tmapRouteLine = null; 
        let tmapRouteBand = null; 
        let coreMarkerOverlay = null;
        let placeCache = new Map();
        
        let tooltipOverlay = new kakao.maps.CustomOverlay({ xAnchor: 0.5, yAnchor: 1.5, zIndex: 150 });

        const BRAND_CONFIG = {
            f_lensme: { kw: '렌즈미', hex: '%239333ea', icon: '🟣', isComp: true },
            f_olens: { kw: '오렌즈', hex: '%23f97316', icon: '🟠', isComp: true },
            f_hapa: { kw: '하파크리스틴', hex: '%23f472b6', icon: '🌸', isComp: true },
            f_winc: { kw: '윙크 렌즈', hex: '%233b82f6', icon: '🔵', isComp: true },
            f_withlens: { kw: '위드렌즈', hex: '%23059669', icon: '🟢', isComp: true },
            f_lensvery: { kw: '렌즈베리', hex: '%23eab308', icon: '🟡', isComp: true },
            f_lenstown: { kw: '렌즈타운', hex: '%23dc2626', icon: '🔴', isComp: true }, 
            f_olive_shop: { kw: '올리브영 안경', hex: '%230f766e', icon: '🌿', isAnchor: true },
            f_olive: { kw: '올리브영', hex: '%2316a34a', icon: '🟩', isAnchor: true },
            f_daiso: { kw: '다이소', hex: '%23e11d48', icon: '🟥', isAnchor: true },
            f_davich: { kw: '다비치안경', hex: '%231d4ed8', icon: '🟦', isOther: true }
        };

        // 전역 클릭 함수 (상권 이름표용)
        window.analyzeDistrict = function(lat, lng, name) {
            moveToAndAnalyze(new kakao.maps.LatLng(lat, lng), name + " 상권");
        };

        // 💡 투트랙 1: 화면 이동 시 렌즈샵 스캔 + 상권 이름표(지하철역 기반) 생성
        kakao.maps.event.addListener(map, 'idle', function() {
            scanMarkersInBounds();
        });

        let searchTimeout = null;
        function scanMarkersInBounds() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                let bounds = map.getBounds();
                
                // 상권 이름표 생성 (지하철역 등 주요 거점을 프록시로 사용)
                districtOverlays.forEach(o => o.setMap(null));
                districtOverlays = [];
                ps.keywordSearch("지하철역", function(data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(place => {
                            let overlay = new kakao.maps.CustomOverlay({
                                position: new kakao.maps.LatLng(place.y, place.x),
                                content: `<div class="district-nametag" onclick="analyzeDistrict(${place.y}, ${place.x}, '${place.place_name}')">📍 ${place.place_name}</div>`,
                                xAnchor: 0.5, yAnchor: 1.5, zIndex: 90
                            });
                            overlay.setMap(map);
                            districtOverlays.push(overlay);
                        });
                    }
                }, { bounds: bounds, size: 10 }); // 화면 내 최대 10개 표시

                // 매장 핀 실시간 생성
                let activeKeys = Object.keys(BRAND_CONFIG).filter(key => document.getElementById(key) && document.getElementById(key).checked);
                activeKeys.forEach(key => {
                    ps.keywordSearch(BRAND_CONFIG[key].kw, function(data, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            data.forEach(place => processPlaceAndDrawMarker(place, key));
                        }
                    }, { bounds: bounds, size: 15 });
                });
            }, 400);
        }

        function searchLocation() {
            let q = document.getElementById('searchInput').value.trim();
            if(!q) return;
            ps.keywordSearch(q, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    let place = data[0];
                    moveToAndAnalyze(new kakao.maps.LatLng(place.y, place.x), place.place_name);
                }
            });
        }

        function triggerScan() { 
            placeCache.clear(); 
            mapMarkers.forEach(m => m.setMap(null)); mapMarkers = [];
            scanMarkersInBounds();
            runTradeAreaAnalysis(); 
        }
        
        function moveToAndAnalyze(latLng, locationName) {
            searchCenter = latLng;
            map.setCenter(searchCenter);
            document.getElementById('targetLocationInput').value = locationName;
            updateStoreNames();
            runTradeAreaAnalysis(); 
            scanMarkersInBounds(); 
        }

        function processPlaceAndDrawMarker(place, key) {
            if (placeCache.has(place.id)) return false; 
            let isDuplicate = false;
            let skipDeduplication = ['f_daiso', 'f_olive', 'f_olive_shop'].includes(key);

            if (!skipDeduplication) {
                placeCache.forEach((existingItem) => {
                    if(existingItem.brand === key) {
                        let dist = getDistanceMeters(place.y, place.x, existingItem.rawData.y, existingItem.rawData.x);
                        if(dist <= 3) isDuplicate = true; 
                    }
                });
            }
            if (isDuplicate) return false;

            let cfg = BRAND_CONFIG[key];
            let svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="${cfg.hex}" stroke="white" stroke-width="2.5"/></svg>`;
            let markerImage = new kakao.maps.MarkerImage('data:image/svg+xml;utf-8,' + svgString, new kakao.maps.Size(24, 24), { offset: new kakao.maps.Point(12, 12) });
            
            let marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(place.y, place.x), image: markerImage });
            marker.setMap(map);
            mapMarkers.push(marker);
            placeCache.set(place.id, { brand: key, rawData: place, marker: marker });
            
            kakao.maps.event.addListener(marker, 'mouseover', function() {
                tooltipOverlay.setContent(`<div class="store-tooltip">${place.place_name}</div>`);
                tooltipOverlay.setPosition(marker.getPosition());
                tooltipOverlay.setMap(map);
            });
            kakao.maps.event.addListener(marker, 'mouseout', function() {
                tooltipOverlay.setMap(null);
            });
            kakao.maps.event.addListener(marker, 'click', function() {
                moveToAndAnalyze(marker.getPosition(), place.place_name);
            });
            return true;
        }

        // 💡 투트랙 2: 반경 400m 정밀 상권 분석 엔진
        function runTradeAreaAnalysis() {
            document.getElementById('statusMessage').innerText = "🔎 상권 스캔 및 하이브리드 스트리트 탐색 중...";
            
            if(tmapRouteLine) { tmapRouteLine.setMap(null); tmapRouteLine = null; }
            if(tmapRouteBand) { tmapRouteBand.setMap(null); tmapRouteBand = null; } 
            if(coreMarkerOverlay) { coreMarkerOverlay.setMap(null); coreMarkerOverlay = null; }
            tooltipOverlay.setMap(null);
            
            let activeKeys = Object.keys(BRAND_CONFIG).filter(key => document.getElementById(key) && document.getElementById(key).checked);
            let anchorData = { olives: [], daisos: [], comps: [], allValidNodes: [] };
            
            let searchPromises = activeKeys.map(key => new Promise(resolve => {
                ps.keywordSearch(BRAND_CONFIG[key].kw, function(data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(place => {
                            let dist = getDistanceMeters(searchCenter.getLat(), searchCenter.getLng(), place.y, place.x);
                            if(dist <= 400) { 
                                if(key === 'f_olive' || key === 'f_olive_shop') anchorData.olives.push(place);
                                else if(key === 'f_daiso') anchorData.daisos.push(place);
                                else if(BRAND_CONFIG[key].isComp) anchorData.comps.push(place);
                                if(key !== 'f_davich') anchorData.allValidNodes.push(place);
                                
                                processPlaceAndDrawMarker(place, key); 
                            }
                        });
                    }
                    resolve();
                }, { location: searchCenter, radius: 400, size: 15 });
            }));

            Promise.all(searchPromises).then(() => {
                evaluateAndDrawRoute(anchorData);
            });
        }

        async function evaluateAndDrawRoute(anchorData) {
            let olyCount = anchorData.olives.length;
            let daiCount = anchorData.daisos.length;
            let compCount = anchorData.comps.length;

            document.getElementById('comp_count').innerText = compCount + '개';
            document.getElementById('anchor_count').innerText = (olyCount + daiCount) + '개';

            let grade = 'C';
            let gradeBadge = document.getElementById('gradeBadge');
            if ((olyCount >= 2 && compCount >= 2) || olyCount >= 3) {
                grade = 'A';
                gradeBadge.className = "mb-4 text-center py-3 rounded-xl bg-pink-100 border-2 border-pink-500 text-pink-700 font-extrabold text-lg shadow-md";
                gradeBadge.innerHTML = "🔥 A급 핵심 상권 (메인/전국구)";
            } else if (olyCount >= 1 && daiCount >= 1) {
                grade = 'B';
                gradeBadge.className = "mb-4 text-center py-3 rounded-xl bg-blue-100 border-2 border-blue-500 text-blue-700 font-extrabold text-lg shadow-md";
                gradeBadge.innerHTML = "⭐ B급 거점 상권 (가성비/지역밀착)";
            } else {
                gradeBadge.className = "mb-4 text-center py-3 rounded-xl bg-gray-100 border border-gray-300 text-gray-600 font-bold text-sm shadow-sm";
                gradeBadge.innerHTML = "🌱 C급 잠재 상권 (동네/항아리)";
            }

            if (anchorData.allValidNodes.length > 2) {
                // 💡 1. 무게중심 (Center of Gravity) 사거리 타겟팅 알고리즘
                anchorData.allValidNodes.forEach(node => {
                    let score = 0;
                    anchorData.allValidNodes.forEach(other => {
                        if(node.id !== other.id) {
                            let d = getDistanceMeters(node.y, node.x, other.y, other.x);
                            if(d <= 150) score += (150 - d);
                        }
                    });
                    node.densityScore = score || 1; 
                });
                
                let sumLat = 0, sumLng = 0, weightSum = 0;
                anchorData.allValidNodes.forEach(n => {
                    sumLat += parseFloat(n.y) * n.densityScore;
                    sumLng += parseFloat(n.x) * n.densityScore;
                    weightSum += n.densityScore;
                });
                
                // 편향되지 않은 진짜 '사거리/길목' 중앙 좌표
                let cgLat = sumLat / weightSum;
                let cgLng = sumLng / weightSum;
                let cgLatLng = new kakao.maps.LatLng(cgLat, cgLng);
                
                drawCoreMarker(cgLatLng);

                // 💡 2. 하이브리드 스트리트 엔진 (항아리형 vs 선형 자동 판단)
                let sortedNodes = [...anchorData.allValidNodes].sort((a,b) => b.densityScore - a.densityScore);
                
                // 무게중심에서 가장 먼 노드 (상권의 한쪽 끝)
                let end1 = [...anchorData.allValidNodes].sort((a,b) => 
                    getDistanceMeters(cgLat, cgLng, b.y, b.x) - getDistanceMeters(cgLat, cgLng, a.y, a.x)
                )[0];
                
                // 상권의 반대쪽 끝
                let end2 = [...anchorData.allValidNodes].sort((a,b) => 
                    getDistanceMeters(end1.y, end1.x, b.y, b.x) - getDistanceMeters(end1.y, end1.x, a.y, a.x)
                )[0];

                let maxSpan = getDistanceMeters(end1.y, end1.x, end2.y, end2.x);

                let startLatLng, targetLatLng;
                if (maxSpan > 250) {
                    // 선형 상권: 상권 양쪽 끝 앵커를 연결하여 길게 뻗은 대로를 칠함
                    startLatLng = new kakao.maps.LatLng(end1.y, end1.x);
                    targetLatLng = new kakao.maps.LatLng(end2.y, end2.x);
                } else {
                    // 항아리 상권: 무게중심(사거리)에서 가장 밀집된 외곽 노드로 짧고 굵게 연결
                    startLatLng = cgLatLng;
                    targetLatLng = new kakao.maps.LatLng(sortedNodes[1].y, sortedNodes[1].x);
                }

                await drawTmapPedestrianRoute(startLatLng, targetLatLng, grade);
            }
            
            document.getElementById('statusMessage').innerText = "✅ 클릭한 상권의 분석이 완료되었습니다!";
            drawRadarChart(compCount, (olyCount + daiCount));
        }

        async function drawTmapPedestrianRoute(startLatLng, endLatLng, grade) {
            try {
                const url = "https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json";
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { "appKey": TMAP_APP_KEY, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        startX: startLatLng.getLng(), startY: startLatLng.getLat(),
                        endX: endLatLng.getLng(), endY: endLatLng.getLat(),
                        reqCoordType: "WGS84GEO", resCoordType: "WGS84GEO",
                        startName: "core1", endName: "core2"
                    })
                });

                if(!response.ok) throw new Error('TMAP Request Failed');
                const data = await response.json();
                
                let linePath = [];
                data.features.forEach(feature => {
                    if (feature.geometry.type === "LineString") {
                        feature.geometry.coordinates.forEach(coord => {
                            linePath.push(new kakao.maps.LatLng(coord[1], coord[0]));
                        });
                    }
                });

                // 스트리트 밴드 (두꺼운 형광펜 효과)
                tmapRouteBand = new kakao.maps.Polyline({
                    path: linePath, strokeWeight: 45, strokeColor: grade === 'A' ? '#fbcfe8' : '#bfdbfe', strokeOpacity: 0.6, strokeStyle: 'solid', strokeLinecap: 'round', strokeLinejoin: 'round'
                });
                tmapRouteBand.setMap(map);

                // 뼈대 중앙 선
                tmapRouteLine = new kakao.maps.Polyline({
                    path: linePath, strokeWeight: 10, strokeColor: grade === 'A' ? '#ec4899' : '#3b82f6', strokeOpacity: 0.9, strokeStyle: 'solid', strokeLinecap: 'round', strokeLinejoin: 'round'
                });
                tmapRouteLine.setMap(map);

            } catch(e) {
                tmapRouteBand = new kakao.maps.Polyline({ path: [startLatLng, endLatLng], strokeWeight: 45, strokeColor: '#e2e8f0', strokeOpacity: 0.6 });
                tmapRouteBand.setMap(map);
                tmapRouteLine = new kakao.maps.Polyline({ path: [startLatLng, endLatLng], strokeWeight: 8, strokeColor: '#94a3b8', strokeOpacity: 0.9 });
                tmapRouteLine.setMap(map);
            }
        }

        function drawCoreMarker(latlng) {
            coreMarkerOverlay = new kakao.maps.CustomOverlay({
                position: latlng,
                content: `<div class="core-marker-container"><div class="core-dot"></div><div class="core-label">🎯 실제 중심 사거리</div></div>`,
                xAnchor: 0.5, yAnchor: 0.5
            });
            coreMarkerOverlay.setMap(map);
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            let R = 6371000; 
            let dLat = (lat2-lat1)*(Math.PI/180), dLon = (lon2-lon1)*(Math.PI/180);
            let a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180))*Math.cos(lat2*(Math.PI/180))*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateStoreNames() {
            let cur = document.getElementById('currentStoreInput').value || "미지정";
            let tar = document.getElementById('targetLocationInput').value || "선택 상권";
            document.querySelectorAll('.currentStoreName').forEach(e => e.innerText = cur);
            document.querySelectorAll('.targetLocationName').forEach(e => e.innerText = tar);
        }

        function switchTab(tabId) {
            document.getElementById('tab-map').classList.add('hidden'); document.getElementById('tab-radar').classList.add('hidden');
            document.getElementById('btn-map').classList.remove('active'); document.getElementById('btn-radar').classList.remove('active');
            document.getElementById('tab-' + tabId).classList.remove('hidden'); document.getElementById('btn-' + tabId).classList.add('active');
            if(tabId === 'map') { map.relayout(); map.setCenter(map.getCenter()); }
            else if (tabId === 'radar') Plotly.Plots.resize(document.getElementById('radarChart')); 
        }

        function drawRadarChart(compCount=0, anchorScoreRaw=0) {
            let compScore = Math.max(10, 100 - (compCount * 8)); 
            let anchorScore = Math.min(100, 30 + (anchorScoreRaw * 15));
            let data = [
                { type: 'scatterpolar', r: [60, 55, 80, 70, 50, 60], theta: ['1030 유동인구', '타겟밀집', '경쟁강도', '임대료가성비', '상권활력', '1030 유동인구'], fill: 'toself', name: document.getElementById('currentStoreInput').value || "미지정", line: {color: 'gray'}, fillcolor: 'rgba(128,128,128,0.4)' },
                { type: 'scatterpolar', r: [anchorScore+5, anchorScore, compScore, 65, anchorScore+5, anchorScore+5], theta: ['1030 유동인구', '타겟밀집', '경쟁강도', '임대료가성비', '상권활력', '1030 유동인구'], fill: 'toself', name: document.getElementById('targetLocationInput').value, line: {color: '#ec4899'}, fillcolor: 'rgba(236,72,153,0.4)' }
            ];
            Plotly.newPlot('radarChart', data, { polar: { radialaxis: {visible: true, range: [0, 100]} }, margin: {t:30, b:30}, legend: {orientation: "h", y: -0.2} }, {responsive: true, displayModeBar: false});
        }

        // 초기 시작 시 기본 로드
        scanMarkersInBounds();
    </script>
