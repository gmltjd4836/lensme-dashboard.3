<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌즈미 상권 분석 (기초 에러 진단기)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 카카오맵 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c045609510f8b75252389123f086be48&libraries=services,drawing"></script>
</head>
<body class="p-4 bg-slate-100 flex flex-col md:flex-row h-screen gap-4">

    <!-- 🚨 에러 출력 박스 (사장님은 여기 뜨는 글씨만 복사해주시면 됩니다) -->
    <div class="w-full md:w-1/3 bg-white p-4 border-4 border-red-500 rounded-xl flex flex-col shadow-lg">
        <h2 class="text-xl font-extrabold text-red-600 mb-2">🚨 실시간 에러 진단창</h2>
        <p class="text-sm text-slate-600 mb-4 font-bold">다각형을 그렸을 때 문제가 생기면, 아래 박스에 뜨는 글씨를 복사해서 채팅창에 붙여넣어 주세요!</p>
        <textarea id="errorLog" class="w-full flex-grow p-3 bg-red-50 text-red-900 text-sm border-2 border-red-200 rounded font-mono font-bold" readonly></textarea>
        <button onclick="document.getElementById('errorLog').value=''" class="mt-2 bg-slate-300 text-slate-700 px-4 py-2 rounded font-bold hover:bg-slate-400">기록 지우기</button>
    </div>
    
    <!-- 🗺️ 기초 지도 테스트 영역 -->
    <div class="w-full md:w-2/3 h-full relative bg-white border-2 border-slate-300 rounded-xl overflow-hidden shadow-lg">
        <div class="absolute top-4 left-4 z-10">
            <button onclick="startDraw()" class="bg-blue-600 text-white px-5 py-3 rounded-lg font-extrabold shadow-md hover:bg-blue-700 border-2 border-blue-800">
                🖍️ 상권 다각형 그리기 (클릭)
            </button>
        </div>
        <div id="map" class="w-full h-full"></div>
    </div>

    <script>
        // 화면에 에러를 강제로 찍어주는 함수
        function logError(msg) {
            const logBox = document.getElementById('errorLog');
            const time = new Date().toLocaleTimeString();
            logBox.value += `[${time}] ${msg}\n\n`;
            logBox.scrollTop = logBox.scrollHeight; // 스크롤 맨 아래로
        }

        // 브라우저에서 몰래 터지는 에러까지 낚아채서 화면에 출력
        window.onerror = function(message, source, lineno, colno, error) {
            logError("브라우저 치명적 에러: " + message + " (줄번호: " + lineno + ")");
        };

        try {
            logError("지도 초기화 시작...");
            let mapContainer = document.getElementById('map');
            let map = new kakao.maps.Map(mapContainer, { center: new kakao.maps.LatLng(37.498095, 127.027610), level: 3 });
            
            let drawingManager = new kakao.maps.drawing.DrawingManager({
                map: map, 
                drawingMode: [kakao.maps.drawing.OverlayType.POLYGON],
                polygonOptions: { fillColor: '#3b82f6', fillOpacity: 0.3, strokeColor: '#1d4ed8', strokeWeight: 3 }
            });
            logError("지도 및 그리기 도구 로딩 성공. 다각형을 그려보세요.");

            function startDraw() {
                drawingManager.select(kakao.maps.drawing.OverlayType.POLYGON);
                logError("그리기 모드 켜짐 (지도에 클릭해서 펜스를 치고 더블클릭으로 닫으세요)");
            }

            drawingManager.addListener('drawend', function(data) {
                try {
                    logError("=====================");
                    logError("더블클릭 감지됨! 다각형 좌표 읽기 시작...");
                    
                    let rawPath = data.target.getPath();
                    let targetArray = (rawPath.length > 0 && Array.isArray(rawPath[0])) ? rawPath[0] : rawPath;
                    
                    if (!targetArray || targetArray.length === 0) {
                        throw new Error("다각형 좌표가 비어있습니다 (0개).");
                    }
                    
                    let sumLat = 0, sumLng = 0;
                    for(let i=0; i<targetArray.length; i++) {
                        let ptLat = typeof targetArray[i].getLat === 'function' ? targetArray[i].getLat() : parseFloat(targetArray[i].y || targetArray[i].lat);
                        let ptLng = typeof targetArray[i].getLng === 'function' ? targetArray[i].getLng() : parseFloat(targetArray[i].x || targetArray[i].lng);
                        
                        if (isNaN(ptLat) || isNaN(ptLng)) {
                            throw new Error(`${i}번째 점의 좌표가 숫자가 아닙니다 (NaN 오류).`);
                        }
                        
                        sumLat += ptLat;
                        sumLng += ptLng;
                    }
                    let cLat = sumLat / targetArray.length;
                    let cLng = sumLng / targetArray.length;
                    
                    logError("다각형 정중앙 좌표 계산 성공! -> " + cLat + ", " + cLng);

                    // 지도에 기본 마커 찍기 시도
                    let marker = new kakao.maps.Marker({
                        position: new kakao.maps.LatLng(cLat, cLng)
                    });
                    marker.setMap(map);
                    
                    logError("지도에 마커 렌더링 명령 완료!");
                    logError("✅ 만약 여기까지 떴는데 지도에 파란색 다각형과 핀이 안 보인다면, 사장님의 카카오 맵키 설정이나 브라우저 렌더링 엔진 쪽의 충돌입니다.");
                    
                } catch (e) {
                    logError("❌ 좌표 계산 및 마커 출력 중 에러 발생: " + e.message);
                }
            });
        } catch(e) {
            logError("❌ 지도 초기화 중 치명적 에러: " + e.message);
        }
    </script>
</body>
</html>
